---
name: Apply Repository Ruleset
description: >-
  Apply the default repository ruleset JSON to the target repository.
  Uses a skip-with-warning path for known plan limitations on rulesets.

inputs:
  owner:
    description: Repository owner (user or organization).
    required: true
  repo_name:
    description: Target repository name.
    required: true
  gh_token:
    description: GitHub token with repository administration permissions.
    required: true
  ruleset_profile:
    description: "Ruleset profile: default, minimal, or coderabbit. Ignored when ruleset_file is set."
    required: false
    default: default
  ruleset_file:
    description: Path to the ruleset JSON payload.
    required: false
    default: ""
  required_status_checks:
    description: >-
      Explicit comma-separated check contexts. When omitted, checks are derived
      from the installed bootstrap profile and workflow files.
    required: false
    default: ""
  profile_file:
    description: Bootstrap profile manifest used to validate installed checks.
    required: false
    default: .github/config/bootstrap-profile.json
  profile:
    description: Selected bootstrap profile name.
    required: false
    default: baseline

outputs:
  ruleset_name:
    description: Name of the ruleset from the selected payload.
    value: ${{ steps.apply_ruleset.outputs.ruleset_name }}
  ruleset_id:
    description: Ruleset ID when created or updated.
    value: ${{ steps.apply_ruleset.outputs.ruleset_id }}
  ruleset_action:
    description: "Action taken: created, updated, or skipped."
    value: ${{ steps.apply_ruleset.outputs.ruleset_action }}
  ruleset_file:
    description: Ruleset file used by the action.
    value: ${{ steps.apply_ruleset.outputs.ruleset_file }}

runs:
  using: composite
  steps:
    - name: Apply default repository ruleset
      id: apply_ruleset
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo_name }}
        RULESET_PROFILE: ${{ inputs.ruleset_profile }}
        RULESET_FILE: ${{ inputs.ruleset_file }}
        REQUIRED_STATUS_CHECKS: ${{ inputs.required_status_checks }}
        PROFILE_FILE: ${{ inputs.profile_file }}
        PROFILE_NAME: ${{ inputs.profile }}
      run: |
        if [ -z "$RULESET_FILE" ]; then
          if [ "$RULESET_PROFILE" = "default" ]; then
            RULESET_FILE=".github/config/ruleset-default.json"
          elif [ "$RULESET_PROFILE" = "minimal" ]; then
            RULESET_FILE=".github/config/ruleset-minimal.json"
          elif [ "$RULESET_PROFILE" = "coderabbit" ]; then
            RULESET_FILE=".github/config/ruleset-coderabbit.json"
          else
            echo "::error::Invalid ruleset_profile '$RULESET_PROFILE'. Allowed: default, minimal, coderabbit."
            exit 1
          fi
        fi

        if [ ! -f "$RULESET_FILE" ]; then
          echo "::error::Ruleset file not found: $RULESET_FILE"
          exit 1
        fi

        if command -v jq >/dev/null 2>&1; then
          RULESET_NAME=$(jq -r '.name // "default"' "$RULESET_FILE")
        elif command -v python3 >/dev/null 2>&1; then
          RULESET_NAME=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('name','default'))" -- "$RULESET_FILE")
        else
          echo "::error::Neither jq nor python3 is available; cannot read ruleset name."
          exit 1
        fi
        echo "ruleset_name=$RULESET_NAME" >> "$GITHUB_OUTPUT"
        echo "ruleset_file=$RULESET_FILE" >> "$GITHUB_OUTPUT"

        if [ -z "$REQUIRED_STATUS_CHECKS" ]; then
          if [ "$PROFILE_FILE" = ".github/config/bootstrap-profile.json" ] &&
            [ ! -f "$PROFILE_FILE" ] &&
            [ -f "templates/.github/config/bootstrap-profile.json" ]; then
            PROFILE_FILE="templates/.github/config/bootstrap-profile.json"
          fi
          if [ ! -f "$PROFILE_FILE" ]; then
            echo "::error::Cannot derive ruleset checks: profile manifest is missing."
            exit 1
          fi
          jq -e --arg profile "$PROFILE_NAME" '.profiles[$profile].capabilities | type == "array" and length > 0' "$PROFILE_FILE" >/dev/null || {
            echo "::error::Selected profile '$PROFILE_NAME' has no validated capabilities."
            exit 1
          }
          REQUIRED_STATUS_CHECKS="Signed-off-by trailers"
          workflow_has_check() {
            local workflow_path="$1"
            local check_name="$2"
            local content
            content=$(gh api "/repos/$OWNER/$REPO/contents/$workflow_path" --jq .content 2>/dev/null | base64 --decode 2>/dev/null) || return 1
            printf '%s\n' "$content" | awk -v expected="$check_name" '
              /^    name:/ {
                value = $0
                sub(/^    name:[[:space:]]*/, "", value)
                sub(/[[:space:]]*$/, "", value)
                if (value == expected) {
                  found = 1
                }
              }
              END { exit(found ? 0 : 1) }
            '
          }
          if workflow_has_check .github/workflows/commit-policy.yml "Signed-off-by trailers"; then
            REQUIRED_STATUS_CHECKS="Signed-off-by trailers"
          else
            REQUIRED_STATUS_CHECKS=""
          fi
          if workflow_has_check .github/workflows/quality.yml quality; then
            REQUIRED_STATUS_CHECKS="$REQUIRED_STATUS_CHECKS,quality"
          fi
          REQUIRED_STATUS_CHECKS="${REQUIRED_STATUS_CHECKS#,}"
          [ -n "$REQUIRED_STATUS_CHECKS" ] || {
            echo "::error::Target repository has no validated bootstrap status workflows."
            exit 1
          }
        fi
        if printf '%s' "$REQUIRED_STATUS_CHECKS" | grep -Eq '(^|,)[[:space:]]*lint[[:space:]]*(,|$)'; then
          echo "::error::The removed lint status check is not supported; use quality."
          exit 1
        fi

        APPLIED_RULESET_FILE="$RULESET_FILE"
        if [ -n "$REQUIRED_STATUS_CHECKS" ]; then
          APPLIED_RULESET_FILE=$(mktemp)
          trap 'rm -f "$APPLIED_RULESET_FILE"' EXIT
          jq -e --arg checks "$REQUIRED_STATUS_CHECKS" '
            ($checks | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $contexts |
            if ($contexts | length) == 0 then
              error("required_status_checks must contain at least one context")
            else
              .rules |= map(
                if .type == "required_status_checks" then
                  .parameters.strict_required_status_checks_policy = true |
                  .parameters.required_status_checks = ($contexts | map({context: .}))
                else . end
              ) |
              if any(.rules[]?; .type == "required_status_checks") then . else
                .rules += [{
                  "type": "required_status_checks",
                  "parameters": {
                    "strict_required_status_checks_policy": true,
                    "required_status_checks": ($contexts | map({context: .}))
                  }
                }]
              end
            end
          ' "$RULESET_FILE" > "$APPLIED_RULESET_FILE"
          RULESET_FILE="$APPLIED_RULESET_FILE"
        fi

        jq -e '
          any(.rules[]?; .type == "required_status_checks" and
            (.parameters.required_status_checks | type == "array" and length > 0))
        ' "$RULESET_FILE" >/dev/null

        # List failures (for example feature/plan restrictions) should not abort
        # the flow before create/update handling; treat them as no existing ruleset.
        EXISTING_RULESET_ID=$(gh api --paginate /repos/"$OWNER"/"$REPO"/rulesets --jq '.[] | [.id, .name] | @tsv' 2>/dev/null | while IFS=$'\t' read -r id name; do
          if [ "$name" = "$RULESET_NAME" ]; then
            printf '%s\n' "$id"
            break
          fi
        done || true)
        EXISTING_RULESET_ID=${EXISTING_RULESET_ID%%$'\n'*}

        if [ -n "$EXISTING_RULESET_ID" ]; then
          METHOD="PATCH"
          ENDPOINT="/repos/$OWNER/$REPO/rulesets/$EXISTING_RULESET_ID"
          ACTION_TEXT="updated"
          ACTION_OUTPUT="updated"
        else
          METHOD="POST"
          ENDPOINT="/repos/$OWNER/$REPO/rulesets"
          ACTION_TEXT="applied"
          ACTION_OUTPUT="created"
        fi

        RESPONSE=$(gh api \
          --method "$METHOD" \
          -H "Accept: application/vnd.github+json" \
          "$ENDPOINT" \
          --input "$RULESET_FILE" 2>&1) || {
          EXIT_CODE=$?
          # Only skip silently for known plan-tier or feature-gate messages.
          # Generic 422 schema errors are surfaced as failures so payload bugs are visible.
          if echo "$RESPONSE" | grep -Eiq "Upgrade to GitHub Pro|public repositories with GitHub Free|rulesets are available|GitHub Advanced Security must be enabled|Copilot is not enabled|Copilot Business|Copilot Enterprise"; then
            echo "ruleset_id=" >> "$GITHUB_OUTPUT"
            echo "ruleset_action=skipped" >> "$GITHUB_OUTPUT"
            echo "⚠️ Ruleset setup skipped: repository plan or required features are not enabled." >> "$GITHUB_STEP_SUMMARY"
            echo "Details: $RESPONSE" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Ruleset setup skipped due to plan/feature limitations. See step summary for details."
            exit 0
          fi
          echo "$RESPONSE"
          exit "$EXIT_CODE"
        }

        if [ -n "$EXISTING_RULESET_ID" ]; then
          RULESET_ID="$EXISTING_RULESET_ID"
        else
          RULESET_ID="$(printf '%s' "$RESPONSE" | jq -r '.id // ""')"
        fi
        echo "ruleset_id=$RULESET_ID" >> "$GITHUB_OUTPUT"
        echo "ruleset_action=$ACTION_OUTPUT" >> "$GITHUB_OUTPUT"

        echo "✅ Repository ruleset $ACTION_TEXT" >> "$GITHUB_STEP_SUMMARY"
