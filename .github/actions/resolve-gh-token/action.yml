---
name: Resolve GitHub Token
description: >-
  Resolves an isolated GitHub App installation token or user access token.

inputs:
  client_id:
    description: GitHub App client ID for App-based auth.
    required: true
  app_private_key:
    description: GitHub App private key (PEM) for App-based auth.
    required: false
  app_user_refresh_token:
    description: GitHub App refresh token for the target personal account.
    required: false
  app_user_owner:
    description: Personal account that owns the GitHub App user token; defaults to target_owner.
    required: false
    default: ""
  refresh_token_secret:
    description: Secret name where the rotated GitHub App refresh token is stored.
    required: true
  refresh_token_secret_environment:
    description: Actions environment whose refresh token should be rotated.
    required: false
    default: ""
  secret_writer_token:
    description: Optional token with permission to persist the rotated refresh token.
    required: false
    default: ""
  access_token_secret:
    description: Optional secret name where the refreshed App user access token is stored.
    required: false
    default: ""
  app_client_secret:
    description: GitHub App client secret used to exchange the refresh token.
    required: false
  app_owner:
    description: Owner bound to the App installation or user access token.
    required: true
  app_installation_identity:
    description: Non-secret configured identity for the App credential profile.
    required: false
    default: ""
  target_owner:
    description: Target repository owner; must match app_owner.
    required: true
  token_mode:
    description: Token mode; auto, installation, bootstrap-refresh, or legacy user alias.
    required: false
    default: auto
  permission_profile:
    description: Permission set required by the calling workflow phase.
    required: true
  repositories:
    description: Comma- or newline-separated repository names; required except for repository-creation.
    required: false
    default: ""

outputs:
  token:
    description: Resolved and masked GitHub App token.
    value: ${{ steps.finalize.outputs.token }}
  auth_mode:
    description: Authentication mode used (app or app-user).
    value: ${{ steps.finalize.outputs.auth_mode }}
  app_slug:
    description: Authenticated GitHub App slug for bot commit identity.
    value: ${{ steps.app-token.outputs.app-slug }}
  token_mode:
    description: Normalized non-secret token mode.
    value: ${{ steps.finalize.outputs.token_mode }}
  connector_metadata:
    description: Normalized non-secret connector metadata as JSON.
    value: ${{ steps.finalize.outputs.connector_metadata }}
runs:
  using: composite
  steps:
    - name: Validate GitHub App configuration
      id: validate-auth-mode
      shell: bash
      env:
        APP_CLIENT_ID: ${{ inputs.client_id }}
        APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
        APP_USER_REFRESH_TOKEN: ${{ inputs.app_user_refresh_token }}
        APP_USER_OWNER: ${{ inputs.app_user_owner }}
        APP_CLIENT_SECRET: ${{ inputs.app_client_secret }}
        GH_TOKEN: ${{ github.token }}
        APP_OWNER: ${{ inputs.app_owner }}
        APP_INSTALLATION_IDENTITY: ${{ inputs.app_installation_identity }}
        TARGET_OWNER: ${{ inputs.target_owner }}
        TOKEN_MODE: ${{ inputs.token_mode }}
        PERMISSION_PROFILE: ${{ inputs.permission_profile }}
        REPOSITORIES: ${{ inputs.repositories }}
      run: |
        set -euo pipefail
        case "$PERMISSION_PROFILE" in
          repository-creation|repository-setup|repository-cleanup|e2e-dispatch|e2e-fixture|weekly-tooling|maintenance-labeling|workflow-approval|maintenance-review|maintenance-merge|release-please|e2e-lifecycle) ;;
          *) echo "::error::Unsupported GitHub App permission profile '$PERMISSION_PROFILE'." >&2; exit 1 ;;
        esac
        case "$TOKEN_MODE" in
          auto|installation|bootstrap-refresh|user) ;;
          *) echo "::error::Unsupported token mode '$TOKEN_MODE'. Allowed: auto, installation, bootstrap-refresh, user." >&2; exit 1 ;;
        esac
        if [ -n "$APP_INSTALLATION_IDENTITY" ] && ! [[ "$APP_INSTALLATION_IDENTITY" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,99}$ ]]; then
          echo "::error::app_installation_identity must be a GitHub-safe identifier." >&2
          exit 1
        fi
        if [ "$PERMISSION_PROFILE" != "repository-creation" ] && [ "$PERMISSION_PROFILE" != "e2e-lifecycle" ] && [ -z "$REPOSITORIES" ]; then
          echo "::error::Repository scoping is required for the '$PERMISSION_PROFILE' permission profile." >&2
          exit 1
        fi
        if [ -n "$REPOSITORIES" ]; then
          while IFS= read -r repository; do
            if [ -z "$repository" ] || [[ "$repository" == */* || "$repository" == *\** ]]; then
              echo "::error::Cross-owner repository scope is not allowed; use repository names only." >&2
              exit 1
            fi
          done < <(printf '%s\n' "$REPOSITORIES" | sed 's/,/\n/g')
        fi
        if [ -n "$APP_USER_REFRESH_TOKEN" ]; then
          echo "::add-mask::$APP_USER_REFRESH_TOKEN"
        fi
        if [ -n "$APP_CLIENT_SECRET" ]; then
          echo "::add-mask::$APP_CLIENT_SECRET"
        fi
        user_owner="${APP_USER_OWNER:-$TARGET_OWNER}"
        if [ -n "$APP_USER_REFRESH_TOKEN" ]; then
          AUTH_MODE=owner-only APP_OWNER="$user_owner" TARGET_OWNER="$user_owner" bash ./scripts/github-setup/validate-app-auth.sh
          target_owner_type="$(gh api "/users/$user_owner" --jq '.type')"
        else
          AUTH_MODE=owner-only bash ./scripts/github-setup/validate-app-auth.sh
          target_owner_type="$(gh api "/users/$TARGET_OWNER" --jq '.type')"
        fi

        case "$target_owner_type" in
          User)
            if [ "$TOKEN_MODE" = "auto" ] && { [ -n "$APP_USER_REFRESH_TOKEN" ] || [ -n "$APP_CLIENT_SECRET" ]; }; then
              NORMALIZED_TOKEN_MODE=bootstrap-refresh
            elif [ "$TOKEN_MODE" = "bootstrap-refresh" ] || [ "$TOKEN_MODE" = "user" ]; then
              NORMALIZED_TOKEN_MODE=bootstrap-refresh
            else
              NORMALIZED_TOKEN_MODE=installation
            fi
            if [ "$NORMALIZED_TOKEN_MODE" = "bootstrap-refresh" ]; then
              if [ -z "$APP_USER_REFRESH_TOKEN" ] || [ -z "$APP_CLIENT_SECRET" ]; then
                echo "::error::Personal-account creation requires both the App refresh token and client secret." >&2
                exit 1
              fi
              case "$PERMISSION_PROFILE" in
                repository-creation|repository-cleanup|e2e-dispatch|e2e-fixture) ;;
                *)
                  echo "::error::GitHub App user access tokens are supported only for repository creation, explicitly scoped cleanup, and E2E dispatch." >&2
                  exit 1
                  ;;
              esac
              case "$APP_USER_REFRESH_TOKEN" in
                ghr_*) ;;
                *)
                  echo "::error::Personal-account creation requires a GitHub App refresh token (ghr_ prefix); PATs and other token types are rejected." >&2
                  exit 1
                  ;;
              esac
              AUTH_MODE=app-user APP_OWNER="$user_owner" TARGET_OWNER="$user_owner" bash ./scripts/github-setup/validate-app-auth.sh
              echo "mode=app-user-refresh" >> "$GITHUB_OUTPUT"
            else
              case "$PERMISSION_PROFILE" in
                repository-creation|repository-cleanup)
                  echo "::error::Personal-account creation requires the App user refresh token and client secret inputs." >&2
                  exit 1
                  ;;
              esac
              AUTH_MODE=app bash ./scripts/github-setup/validate-app-auth.sh
              echo "mode=app" >> "$GITHUB_OUTPUT"
            fi
            ;;
          Organization)
            if [ "$TOKEN_MODE" = "bootstrap-refresh" ] || [ "$TOKEN_MODE" = "user" ]; then
              echo "::error::bootstrap-refresh is not allowed for runtime profiles or organization targets." >&2
              exit 1
            fi
            NORMALIZED_TOKEN_MODE=installation
            AUTH_MODE=app bash ./scripts/github-setup/validate-app-auth.sh
            echo "mode=app" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Unable to classify target owner '$TARGET_OWNER' as a GitHub User or Organization." >&2
            exit 1
            ;;
        esac
        if [ "$TOKEN_MODE" = "installation" ] && [ -z "$APP_INSTALLATION_IDENTITY" ]; then
          echo "::error::app_installation_identity is required for explicit installation mode." >&2
          exit 1
        fi
        if [ -z "$APP_INSTALLATION_IDENTITY" ]; then
          APP_INSTALLATION_IDENTITY="legacy-${APP_OWNER}"
        fi
        scope_json="$(printf '%s\n' "$REPOSITORIES" | sed 's/,/\n/g' | jq -Rsc 'split("\n") | map(select(length > 0))')"
        connector_metadata="$(jq -cn \
          --arg identity "$APP_INSTALLATION_IDENTITY" \
          --arg app_owner "$APP_OWNER" \
          --arg target_owner "$TARGET_OWNER" \
          --arg permission_profile "$PERMISSION_PROFILE" \
          --arg token_mode "$NORMALIZED_TOKEN_MODE" \
          --argjson repositories "$scope_json" \
          '{app_installation_identity: $identity, app_owner: $app_owner, target_owner: $target_owner, permission_profile: $permission_profile, token_mode: $token_mode, repositories: $repositories}')"
        {
          echo "token_mode=$NORMALIZED_TOKEN_MODE"
          echo "connector_metadata=$connector_metadata"
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub App installation token
      id: app-token
      if: steps.validate-auth-mode.outputs.mode == 'app'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.app_owner }}
        repositories: ${{ inputs.repositories }}
        permission-administration: ${{ (inputs.permission_profile == 'repository-creation' || inputs.permission_profile == 'repository-setup' || inputs.permission_profile == 'repository-cleanup' || inputs.permission_profile == 'e2e-dispatch' || inputs.permission_profile == 'e2e-lifecycle') && 'write' || '' }}
        permission-actions: ${{ (inputs.permission_profile == 'repository-setup' || inputs.permission_profile == 'workflow-approval' || inputs.permission_profile == 'e2e-dispatch') && 'write' || (inputs.permission_profile == 'maintenance-labeling' || inputs.permission_profile == 'maintenance-review') && 'read' || '' }}
        permission-contents: ${{ (inputs.permission_profile == 'repository-creation' || inputs.permission_profile == 'repository-setup' || inputs.permission_profile == 'e2e-dispatch' || inputs.permission_profile == 'weekly-tooling' || inputs.permission_profile == 'release-please' || inputs.permission_profile == 'maintenance-merge') && 'write' || '' }}
        permission-environments: ${{ (inputs.permission_profile == 'repository-setup' || inputs.permission_profile == 'e2e-dispatch') && 'write' || '' }}
        permission-issues: ${{ (inputs.permission_profile == 'weekly-tooling' || inputs.permission_profile == 'maintenance-labeling' || inputs.permission_profile == 'repository-creation' || inputs.permission_profile == 'repository-setup' || inputs.permission_profile == 'e2e-dispatch') && 'write' || '' }}
        permission-organization-administration: ${{ inputs.permission_profile == 'repository-creation' && 'write' || '' }}
        permission-pull-requests: ${{ (inputs.permission_profile == 'weekly-tooling' || inputs.permission_profile == 'maintenance-review' || inputs.permission_profile == 'maintenance-labeling' || inputs.permission_profile == 'release-please' || inputs.permission_profile == 'maintenance-merge') && 'write' || inputs.permission_profile == 'workflow-approval' && 'read' || '' }}
        permission-secrets: ${{ (inputs.permission_profile == 'repository-setup' || inputs.permission_profile == 'e2e-dispatch') && 'write' || '' }}
        permission-workflows: ${{ (inputs.permission_profile == 'repository-creation' || inputs.permission_profile == 'repository-setup' || inputs.permission_profile == 'weekly-tooling') && 'write' || '' }}

    - name: Refresh GitHub App user token
      id: refresh-user-token
      if: steps.validate-auth-mode.outputs.mode == 'app-user-refresh'
      shell: bash
      env:
        APP_CLIENT_ID: ${{ inputs.client_id }}
        APP_CLIENT_SECRET: ${{ inputs.app_client_secret }}
        APP_REFRESH_TOKEN: ${{ inputs.app_user_refresh_token }}
        REFRESH_TOKEN_SECRET: ${{ inputs.refresh_token_secret }}
        REFRESH_TOKEN_SECRET_ENVIRONMENT: ${{ inputs.refresh_token_secret_environment }}
        SECRET_WRITER_TOKEN: ${{ inputs.secret_writer_token }}
        ACCESS_TOKEN_SECRET: ${{ inputs.access_token_secret }}
        APP_USER_OWNER: ${{ inputs.app_user_owner }}
        OWNER: ${{ inputs.app_user_owner || inputs.target_owner }}
      run: |
        set -euo pipefail
        if [ -z "$REFRESH_TOKEN_SECRET_ENVIRONMENT" ]; then
          echo "::error::Refreshing a GitHub App user token requires an explicit refresh-token secret environment." >&2
          exit 1
        fi
        secret_file="$(mktemp)"
        refresh_file="$(mktemp)"
        access_file="$(mktemp)"
        chmod 600 "$secret_file" "$refresh_file" "$access_file"
        trap 'rm -f "$secret_file" "$refresh_file" "$access_file"' EXIT
        printf '%s' "$APP_CLIENT_SECRET" > "$secret_file"
        printf '%s' "$APP_REFRESH_TOKEN" > "$refresh_file"
        APP_CLIENT_SECRET_FILE="$secret_file" bash ./scripts/github-setup/github-app-user-token.sh \
          refresh "$APP_CLIENT_ID" "$refresh_file" "$OWNER" "$access_file" "$refresh_file"
        access_token="$(tr -d '\r\n' < "$access_file")"
        rotated_refresh_token="$(tr -d '\r\n' < "$refresh_file")"
        echo "::add-mask::$access_token"
        echo "::add-mask::$rotated_refresh_token"
        caller_owner="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
        normalized_owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
        normalized_caller="$(printf '%s' "$caller_owner" | tr '[:upper:]' '[:lower:]')"
        if [ -z "$SECRET_WRITER_TOKEN" ] && [ "$normalized_owner" != "$normalized_caller" ]; then
          echo "::error::Cannot rotate the configured refresh-token secret: target user '$OWNER' does not own '$GITHUB_REPOSITORY'. Use an external secret manager or rotate the refresh secret manually." >&2
          exit 1
        fi
        secret_writer_token="${SECRET_WRITER_TOKEN:-$access_token}"
        GH_TOKEN="$secret_writer_token" gh secret set "$REFRESH_TOKEN_SECRET" --repo "$GITHUB_REPOSITORY" --env "$REFRESH_TOKEN_SECRET_ENVIRONMENT" < "$refresh_file"
        if [ -n "$ACCESS_TOKEN_SECRET" ]; then
          printf '%s' "$access_token" | GH_TOKEN="$secret_writer_token" gh secret set "$ACCESS_TOKEN_SECRET" --repo "$GITHUB_REPOSITORY" --env "$REFRESH_TOKEN_SECRET_ENVIRONMENT"
        fi
        {
          echo "token=$access_token"
          echo "auth_mode=app-user"
        } >> "$GITHUB_OUTPUT"

    - name: Finalize token output
      id: finalize
      shell: bash
      env:
        AUTH_MODE: ${{ steps.validate-auth-mode.outputs.mode }}
        TOKEN_MODE: ${{ steps.validate-auth-mode.outputs.token_mode }}
        CONNECTOR_METADATA: ${{ steps.validate-auth-mode.outputs.connector_metadata }}
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_USER_TOKEN: ${{ steps.refresh-user-token.outputs.token }}
      run: |
        set -euo pipefail
        if [ "$AUTH_MODE" = "app-user-refresh" ]; then
          TOKEN="$APP_USER_TOKEN"
        elif [ "$AUTH_MODE" = "app" ]; then
          TOKEN="$APP_TOKEN"
        else
          echo "::error::Unexpected authentication mode '$AUTH_MODE'." >&2
          exit 1
        fi

        if [ -z "$TOKEN" ]; then
          echo "::error::Resolved auth mode '$AUTH_MODE' but no token was produced."
          exit 1
        fi

        echo "::add-mask::$TOKEN"
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        if [ "$AUTH_MODE" = "app-user-refresh" ]; then
          echo "auth_mode=app-user" >> "$GITHUB_OUTPUT"
        else
          echo "auth_mode=$AUTH_MODE" >> "$GITHUB_OUTPUT"
        fi
        echo "token_mode=$TOKEN_MODE" >> "$GITHUB_OUTPUT"
        echo "connector_metadata=$CONNECTOR_METADATA" >> "$GITHUB_OUTPUT"
