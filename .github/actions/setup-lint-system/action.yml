name: Setup Lint (system)
description: Install system-level lint dependencies
runs:
  using: composite
  steps:
    - name: Set up Go for actionlint
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.26.6"
        cache: false
    - name: Set up terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "1.15.6"
        terraform_wrapper: false
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
    - name: Install system tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck shfmt libxml2-utils jq
        mkdir -p "$HOME/.local/bin"
        GOBIN="$HOME/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        uv sync --locked
        npm install -g prettier@3.9.6 markdownlint-cli@0.49.1 @taplo/cli@0.7.0
        printf '%s\n' "$PWD/.venv/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
