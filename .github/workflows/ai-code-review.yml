# AI-powered code review using Claude.
#
# This workflow provides AI code review on pull requests using Anthropic's
# Claude via the official claude-code-action. It focuses on high-impact issues:
# security vulnerabilities, bugs, logic errors, and critical design flaws.
#
# Setup:
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Configure Anthropic Workload Identity Federation for this repository.
#   3. Set repository variables ANTHROPIC_FEDERATION_RULE_ID,
#      ANTHROPIC_ORGANIZATION_ID, and ANTHROPIC_SERVICE_ACCOUNT_ID.
#
# The workflow is comment-triggered and uses GitHub OIDC for a short-lived
# Anthropic token. It never reads a static API key or OAuth token secret.
#
# CodeRabbit integration:
#   This workflow complements CodeRabbit (configured via .coderabbit.yaml).
#   CodeRabbit can run through its GitHub App; the optional
#   Request CodeRabbit Review workflow provides explicit opt-in when needed.
#   Together they provide two independent AI reviewers when both are enabled.

name: AI Code Review

on:
  issue_comment:
    types: [created]

# Do NOT cancel in-progress runs. Cancellation shows as a failed check in GitHub
# and can hide the result of an explicitly requested review.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    name: Claude AI Review
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Only trusted repository collaborators can invoke Claude with @claude.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.issue.labels.*.name, 'skip-ai-review') &&
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )

    steps:
      - name: Check Anthropic federation configuration
        id: check-federation
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        run: |
          if [[ -n "$FEDERATION_RULE_ID" && -n "$ORGANIZATION_ID" && -n "$SERVICE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Claude review — Anthropic OIDC federation variables are not configured."
          fi

      - name: Run Claude Code Review
        if: steps.check-federation.outputs.configured == 'true'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          prompt: |
            REPOSITORY: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            # Direct Claude to focus on high-impact issues only
            Review this pull request focusing ONLY on high-impact issues:

            1. **Security vulnerabilities** — injection, auth bypass, secrets exposure, unsafe deserialization, path traversal, XSS, CSRF
            2. **Bugs and logic errors** — null pointer issues, off-by-one errors, race conditions, resource leaks, incorrect error handling
            3. **Critical design flaws** — violations of SOLID principles, missing input validation, broken API contracts

            DO NOT comment on:
            - Style preferences (linters handle this)
            - Minor naming suggestions
            - Trivial improvements that don't affect correctness or security
            - Documentation formatting

            For each issue found, explain WHY it is a problem and suggest a concrete fix.
            If the PR looks good with no high-impact issues, say so briefly.
