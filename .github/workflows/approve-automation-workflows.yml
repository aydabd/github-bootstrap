name: Approve Eligible Automation Workflows

on:
  workflow_run:
    types: [completed]
    workflows:
      - Quality
      - Commit policy
      - Test Quality Providers
      - CodeQL Security Scan

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  approve:
    if: github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-latest
    environment: production-maintenance
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout validation helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/resolve-gh-token/action.yml
            scripts/github-setup/gh-common.sh
            scripts/github-setup/validate-app-auth.sh
            scripts/github-setup/validate-workflow-approval.sh

      - name: Resolve Reviewer App token
        id: resolve-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ vars.BOOTSTRAP_REVIEWER_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.BOOTSTRAP_REVIEWER_APP_PRIVATE_KEY }}
          app_owner: ${{ github.repository_owner }}
          target_owner: ${{ github.repository_owner }}
          permission_profile: workflow-approval
          repositories: ${{ github.event.repository.name }}

      - name: Verify resolved Reviewer App identity
        env:
          APP_SLUG: ${{ steps.resolve-token.outputs.app_slug }}
          APP_ID: ${{ steps.resolve-token.outputs.app_id }}
          EXPECTED_APP_SLUG: ${{ vars.BOOTSTRAP_MAINTENANCE_REVIEWER_APP_SLUG }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$APP_SLUG" ] || { echo "Reviewer App slug was not resolved" >&2; exit 1; }
          [[ "$APP_ID" =~ ^[0-9]+$ ]] || { echo "Reviewer App ID was not resolved" >&2; exit 1; }
          [ -n "$EXPECTED_APP_SLUG" ] || { echo "Expected maintenance Reviewer App slug is not configured" >&2; exit 1; }
          [ "$APP_SLUG" = "$EXPECTED_APP_SLUG" ] || { echo "Resolved App is not the configured maintenance Reviewer" >&2; exit 1; }

      - name: Validate workflow run and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          WRITER_APP_SLUG: ${{ vars.BOOTSTRAP_MAINTENANCE_WRITER_APP_SLUG }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATOR: scripts/github-setup/validate-workflow-approval.sh
        shell: bash
        run: |
          set -euo pipefail
          run_file="$RUNNER_TEMP/workflow-run.json"
          pr_file="$RUNNER_TEMP/pull-request.json"
          changed_files="$RUNNER_TEMP/changed-files.txt"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$run_file"
          pr_number="$(jq -r '.pull_requests[0].number // empty' "$run_file")"
          [ -n "$pr_number" ] || { echo "workflow run has no pull request" >&2; exit 1; }
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$pr_file"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$pr_number/files" --jq '.[].filename' > "$changed_files"
          "$VALIDATOR" "$run_file" "$pr_file" "$changed_files"
          printf '%s\n' "$pr_number" > "$RUNNER_TEMP/pull-request-number"

      - name: Approve workflow run
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/approve"
