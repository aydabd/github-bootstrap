name: Classify Maintenance Pull Request

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  classify:
    name: Classify trusted automation PR
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    environment: production-maintenance
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            scripts/github-setup/validate-maintenance-pr.sh
            .github/actions/resolve-gh-token/action.yml
            scripts/github-setup/gh-common.sh
            scripts/github-setup/validate-app-auth.sh
            .release-please-manifest.json

      - name: Resolve Writer App token
        id: resolve-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ vars.BOOTSTRAP_MAINTENANCE_WRITER_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.BOOTSTRAP_MAINTENANCE_WRITER_APP_PRIVATE_KEY }}
          app_owner: ${{ github.repository_owner }}
          target_owner: ${{ github.repository_owner }}
          permission_profile: maintenance-labeling
          repositories: ${{ github.event.repository.name }}

      - name: Verify Writer App installation
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          APP_SLUG: ${{ steps.resolve-token.outputs.app_slug }}
          EXPECTED_APP_SLUG: ${{ vars.BOOTSTRAP_MAINTENANCE_WRITER_APP_SLUG }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$APP_SLUG" ] || {
            echo "Writer App slug was not resolved" >&2
            exit 1
          }
          [ -n "$EXPECTED_APP_SLUG" ] || {
            echo "Expected Writer App slug is not configured" >&2
            exit 1
          }
          [ "$APP_SLUG" = "$EXPECTED_APP_SLUG" ] || {
            echo "Resolved App '$APP_SLUG' is not the configured Writer '$EXPECTED_APP_SLUG'" >&2
            exit 1
          }

      - name: Classify and label trusted automation PR
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FULL_REPOSITORY: ${{ github.repository }}
          WRITER_APP_SLUG: ${{ vars.BOOTSTRAP_MAINTENANCE_WRITER_APP_SLUG }}
        shell: bash
        run: |
          set -euo pipefail
          pr_file="$RUNNER_TEMP/pull-request.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr_file"
          if ! classification="$(bash scripts/github-setup/validate-maintenance-pr.sh "$pr_file")"; then
            echo "Pull request is not an eligible maintenance automation PR; skipping classification."
            exit 0
          fi

          labels=("automation: maintenance" "automation: validating")
          if [ "$classification" = "dependabot" ]; then
            labels+=(dependencies)
          fi

          # A major release-please bump must clear generated-repository E2E before
          # it can merge; validate-maintenance-safety.sh enforces that whenever the
          # "automation: breaking" label is present.
          if [ "$classification" = "release-please" ]; then
            pr_title="$(jq -r '.title' "$pr_file")"
            new_major="$(printf '%s\n' "$pr_title" | sed -n 's/.*release \([0-9][0-9]*\)\.[0-9][0-9]*\.[0-9][0-9]*.*/\1/p')"
            # The root package is keyed "." in release-please-config.json; read it
            # explicitly rather than relying on manifest entry order.
            current_version="$(jq -r '."." // "0.0.0"' .release-please-manifest.json)"
            current_major="${current_version%%.*}"
            if [ -n "$new_major" ] && [ "$new_major" -gt "${current_major:-0}" ]; then
              labels+=("automation: breaking")
              echo "Release $pr_title raises the major version from $current_version; marking as breaking."
            fi
          fi

          label_args=()
          for label in "${labels[@]}"; do
            label_args+=(-f "labels[]=$label")
          done
          gh api --method POST "/repos/$FULL_REPOSITORY/issues/$PR_NUMBER/labels" \
            "${label_args[@]}" > /dev/null
