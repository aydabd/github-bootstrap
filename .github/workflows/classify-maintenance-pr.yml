name: Classify Maintenance Pull Request

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  classify:
    name: Classify trusted automation PR
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    environment: production-maintenance
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out validation helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            scripts/github-setup/validate-maintenance-pr.sh
            .github/actions/resolve-gh-token/action.yml
            scripts/github-setup/gh-common.sh
            scripts/github-setup/validate-app-auth.sh

      - name: Resolve Writer App token
        id: resolve-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ vars.BOOTSTRAP_MAINTENANCE_WRITER_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.BOOTSTRAP_MAINTENANCE_WRITER_APP_PRIVATE_KEY }}
          app_owner: ${{ github.repository_owner }}
          target_owner: ${{ github.repository_owner }}
          permission_profile: maintenance-labeling
          repositories: ${{ github.event.repository.name }}

      - name: Verify Writer App installation
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          APP_SLUG: ${{ steps.resolve-token.outputs.app_slug }}
          EXPECTED_APP_SLUG: ${{ vars.BOOTSTRAP_MAINTENANCE_WRITER_APP_SLUG }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$APP_SLUG" ] || {
            echo "Writer App slug was not resolved" >&2
            exit 1
          }
          [ -n "$EXPECTED_APP_SLUG" ] || {
            echo "Expected Writer App slug is not configured" >&2
            exit 1
          }
          [ "$APP_SLUG" = "$EXPECTED_APP_SLUG" ] || {
            echo "Resolved App '$APP_SLUG' is not the configured Writer '$EXPECTED_APP_SLUG'" >&2
            exit 1
          }
          gh api /installation --jq '{app_slug,repository_selection,permissions}'

      - name: Classify and label trusted automation PR
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FULL_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr_file="$RUNNER_TEMP/pull-request.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr_file"
          if ! classification="$(bash scripts/github-setup/validate-maintenance-pr.sh "$pr_file")"; then
            echo "Pull request is not an eligible maintenance automation PR; skipping classification."
            exit 0
          fi

          labels=("automation: maintenance" "automation: validating")
          if [ "$classification" = "dependabot" ]; then
            labels+=(dependencies)
          fi

          label_args=()
          for label in "${labels[@]}"; do
            label_args+=(-f "labels[]=$label")
          done
          gh api --method POST "/repos/$FULL_REPOSITORY/issues/$PR_NUMBER/labels" \
            "${label_args[@]}" > /dev/null
