name: Create Bootstrap Repository
run-name: Create Bootstrap Repository - ${{ inputs.repo_name }}

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "New repository name"
        required: true
        type: string
      repo_owner:
        description: "Repository owner (user/org)"
        required: false
        type: string
      repo_description:
        description: "Repository description"
        required: false
        default: "Repository following SOLID principles and best practices"
        type: string
      visibility:
        description: "Repository visibility"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - private
          - internal
      cleanup_on_failure:
        description: "Delete repository if creation fails"
        required: false
        default: true
        type: boolean
      team_name:
        description: "GitHub team for code owners (e.g., org/team-leads)"
        required: false
        default: "team-leads"
        type: string
      license_holder:
        description: "License copyright holder name"
        required: false
        type: string
      languages:
        description: "Programming languages. For tooling templates, the first language is used (e.g. python,typescript). Use 'all' for monorepo metadata/workflow configuration."
        required: false
        default: "language-agnostic-only"
        type: string
      env_manager:
        description: "Environment manager for local tooling"
        required: true
        type: choice
        options:
          - micromamba
          - mise
          - system
      python_version:
        description: "Python version for generated tooling"
        required: false
        default: "3.13"
        type: string
      node_version:
        description: "Node.js version for generated tooling"
        required: false
        default: "24"
        type: string
      go_version:
        description: "Go version for generated tooling"
        required: false
        default: "1.26"
        type: string
      java_version:
        description: "Java version for generated tooling"
        required: false
        default: "25"
        type: string
      release_tool:
        description: >-
          Release automation tool:
          'git-cliff' (tag-triggered, fast changelog, any language),
          'release-please' (PR-based, auto-bumps version files)
        required: false
        default: "git-cliff"
        type: choice
        options:
          - git-cliff
          - release-please
      enable_repo_settings:
        description: >-
          Apply repository settings PATCH, create dev/prod environments, and
          enable Dependabot security updates. Repository ruleset application is
          handled separately and is not controlled by this toggle.
        required: false
        default: true
        type: boolean
      enable_codeowners:
        description: "Add a CODEOWNERS file assigning the chosen team as default reviewer"
        required: false
        default: true
        type: boolean
      workflows:
        description: >-
          Comma-separated list of workflows to include, or 'all' to keep
          everything, or 'none' to skip all. Valid names: quality, codeql,
          ai-code-review, release.
        required: false
        default: "all"
        type: string
      optional_features:
        description: Optional feature bundles to include, such as github-planning.
        required: false
        default: "none"
        type: string
      delivery_mode:
        description: Embed workflows locally or reference a user-owned central repository.
        required: false
        default: embedded
        type: choice
        options:
          - embedded
          - centralized
      central_repository:
        description: User-owned central repository and immutable ref as OWNER/REPOSITORY@REF (required for centralized mode).
        required: false
        type: string
      github_host:
        description: GitHub hostname for GitHub.com or GitHub Enterprise Server.
        required: false
        default: "github.com"
        type: string
      client_id:
        description: "GitHub App client ID"
        required: true
        type: string
      app_owner:
        description: "Owner whose GitHub App installation or user token should be used"
        required: true
        type: string
      allowed_repo_owners:
        description: "Comma-separated allowlist of permitted target owners"
        required: true
        type: string
      require_cleanup_approval:
        description: "Require environment approval before deleting a failed repo"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      repo_owner:
        required: false
        type: string
      repo_description:
        required: false
        default: "Repository following SOLID principles and best practices"
        type: string
      visibility:
        required: false
        default: "public"
        type: string
      cleanup_on_failure:
        required: false
        default: true
        type: boolean
      team_name:
        required: false
        default: "team-leads"
        type: string
      license_holder:
        required: false
        type: string
      languages:
        required: false
        default: "language-agnostic-only"
        type: string
      env_manager:
        required: true
        type: string
      python_version:
        required: false
        default: "3.13"
        type: string
      node_version:
        required: false
        default: "24"
        type: string
      go_version:
        required: false
        default: "1.26"
        type: string
      java_version:
        required: false
        default: "25"
        type: string
      release_tool:
        required: false
        default: "git-cliff"
        type: string
      enable_repo_settings:
        required: false
        default: true
        type: boolean
      enable_codeowners:
        required: false
        default: true
        type: boolean
      workflows:
        required: false
        default: "all"
        type: string
      profile:
        required: false
        default: baseline
        type: string
      profile_capabilities:
        required: false
        default: lint-markdown,lint-json,lint-yaml,lint-shell,lint-python,lint-terraform,lint-format,lint-tests
        type: string
      delivery_mode:
        required: false
        default: embedded
        type: string
      central_repository:
        required: false
        type: string
      central_ref:
        required: false
        type: string
      optional_features:
        required: false
        default: "none"
        type: string
      github_host:
        required: false
        default: "github.com"
        type: string
      client_id:
        required: true
        type: string
      app_owner:
        required: true
        type: string
      allowed_repo_owners:
        required: true
        type: string
      require_cleanup_approval:
        required: false
        default: true
        type: boolean
    secrets:
      BOOTSTRAP_PROVISIONER_APP_PRIVATE_KEY:
        required: false
      BOOTSTRAP_PROVISIONER_APP_USER_TOKEN:
        required: false

jobs:
  create-repository:
    name: Create Repository
    runs-on: ubuntu-latest
    env:
      GH_HOST: ${{ inputs.github_host || 'github.com' }}
    outputs:
      owner: ${{ steps.set-owner.outputs.owner }}
      repo_created: ${{ steps.create-repo.outputs.repo_created }}
    permissions:
      contents: read

    steps:
      - name: Resolve bootstrap repository
        id: bootstrap-repo
        shell: bash
        run: |
          # workflow_ref format: owner/repo/.github/workflows/file.yml@refs/...
          # Always derive from workflow_ref so workflow_call from a different repo
          # checks out the bootstrap repo, not the caller's repo.
          REPO=$(printf '%s' '${{ github.workflow_ref }}' | cut -d'/' -f1,2)
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout bootstrap repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: ${{ steps.bootstrap-repo.outputs.repository }}
          ref: ${{ github.workflow_sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.mod

      - name: Set repository owner
        id: set-owner
        env:
          INPUT_REPO_OWNER: ${{ inputs.repo_owner }}
          DEFAULT_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$INPUT_REPO_OWNER" ]; then
            echo "owner=$DEFAULT_REPO_OWNER" >> "$GITHUB_OUTPUT"
          else
            echo "owner=$INPUT_REPO_OWNER" >> "$GITHUB_OUTPUT"
          fi

      - name: Set license holder
        id: set-license
        env:
          INPUT_LICENSE_HOLDER: ${{ inputs.license_holder }}
          DEFAULT_LICENSE_HOLDER: ${{ github.repository_owner }}
        run: |
          if [ -z "$INPUT_LICENSE_HOLDER" ]; then
            echo "holder=$DEFAULT_LICENSE_HOLDER" >> "$GITHUB_OUTPUT"
          else
            echo "holder=$INPUT_LICENSE_HOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate bootstrap inputs
        id: validate-inputs
        shell: bash
        env:
          LANGUAGES: ${{ inputs.languages }}
          ENV_MANAGER: ${{ inputs.env_manager }}
          PYTHON_VERSION: ${{ inputs.python_version }}
          NODE_VERSION: ${{ inputs.node_version }}
          GO_VERSION: ${{ inputs.go_version }}
          JAVA_VERSION: ${{ inputs.java_version }}
          PROFILE: ${{ inputs.profile || 'baseline' }}
          PROFILE_CAPABILITIES: ${{ inputs.profile_capabilities }}
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
          CENTRAL_REPOSITORY: ${{ inputs.central_repository }}
          CENTRAL_REF: ${{ inputs.central_ref }}
        run: |
          PYTHON_VERSION="${PYTHON_VERSION:-3.13}"
          NODE_VERSION="${NODE_VERSION:-24}"
          GO_VERSION="${GO_VERSION:-1.26}"
          JAVA_VERSION="${JAVA_VERSION:-25}"
          PROFILE="${PROFILE:-baseline}"
          PROFILE_CAPABILITIES="${PROFILE_CAPABILITIES:-lint-markdown,lint-json,lint-yaml,lint-shell,lint-python,lint-terraform,lint-format,lint-tests}"
          PROFILE_CAPABILITIES="$(printf '%s' "$PROFILE_CAPABILITIES" | tr -d '[:space:]')"
          DELIVERY_MODE="${DELIVERY_MODE:-embedded}"
          if [ -z "$CENTRAL_REF" ] && [[ "$CENTRAL_REPOSITORY" == *@* ]]; then
            CENTRAL_REF="${CENTRAL_REPOSITORY##*@}"
            CENTRAL_REPOSITORY="${CENTRAL_REPOSITORY%@*}"
          fi
          if [ "$DELIVERY_MODE" = "embedded" ] && [ -n "$CENTRAL_REPOSITORY" ] && [ -n "$CENTRAL_REF" ]; then
            DELIVERY_MODE=centralized
          fi
          if ! [[ "$ENV_MANAGER" =~ ^(micromamba|mise|system)$ ]]; then
            echo "::error::Invalid env_manager '$ENV_MANAGER'. Allowed: micromamba, mise, system"
            exit 1
          fi

          if ! [[ "$LANGUAGES" =~ ^[a-zA-Z0-9,_-]+$ ]]; then
            echo "::error::Invalid languages input '$LANGUAGES'. Use comma-separated language identifiers."
            exit 1
          fi

          if [ "$PROFILE" != "baseline" ]; then
            echo "::error::Invalid profile '$PROFILE'. Allowed: baseline"
            exit 1
          fi
          if [ "$DELIVERY_MODE" != "embedded" ] && [ "$DELIVERY_MODE" != "centralized" ]; then
            echo "::error::Invalid delivery_mode '$DELIVERY_MODE'. Allowed: embedded, centralized"
            exit 1
          fi
          if [ "$DELIVERY_MODE" = "centralized" ] && { [ -z "$CENTRAL_REPOSITORY" ] || [ -z "$CENTRAL_REF" ]; }; then
            echo "::error::central_repository (OWNER/REPOSITORY@REF for manual runs) and central_ref are required for centralized delivery"
            exit 1
          fi
          if [ "$DELIVERY_MODE" = "centralized" ] && ! [[ "$CENTRAL_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::central_repository must match OWNER/REPOSITORY"
            exit 1
          fi
          if [ "$DELIVERY_MODE" = "centralized" ] && ! [[ "$CENTRAL_REF" =~ ^([0-9a-fA-F]{40}|v?[0-9][A-Za-z0-9._-]*)$ ]]; then
            echo "::error::central_ref must be an immutable-looking version tag or 40-character commit SHA"
            exit 1
          fi
          if ! printf '%s' "$PROFILE_CAPABILITIES" | grep -Eq '^(lint-markdown|lint-json|lint-yaml|lint-actions|lint-shell|lint-python|lint-terraform|lint-format|lint-tests)(,(lint-markdown|lint-json|lint-yaml|lint-actions|lint-shell|lint-python|lint-terraform|lint-format|lint-tests))*$'; then
            echo "::error::profile_capabilities contains an unknown or malformed capability"
            exit 1
          fi

          ERR_FILE=$(mktemp)
          REPO_ROOT="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}"
          BOOTSTRAP_INPUTS_PATH="$REPO_ROOT/tools/cmd/bootstrap-inputs"
          if ! NORMALIZED_JSON=$(go run "$BOOTSTRAP_INPUTS_PATH" \
            --mode validate \
            --languages "$LANGUAGES" \
            --python-version "$PYTHON_VERSION" \
            --node-version "$NODE_VERSION" \
            --go-version "$GO_VERSION" \
            --java-version "$JAVA_VERSION" 2>"$ERR_FILE"); then
            if [ -s "$ERR_FILE" ]; then
              LAST_LINE=$(tail -n 1 "$ERR_FILE")
              ERROR_MESSAGE=$(printf '%s' "$LAST_LINE" | jq -r '.message // empty' 2>/dev/null || true)
              if [ -n "$ERROR_MESSAGE" ]; then
                echo "::error::$ERROR_MESSAGE"
              else
                echo "::error::bootstrap input validation failed"
                echo "::error::Raw bootstrap-inputs output follows"
                while IFS= read -r line; do
                  echo "::error::$line"
                done < "$ERR_FILE"
              fi
            else
              echo "::error::bootstrap input validation failed"
            fi
            rm -f "$ERR_FILE"
            exit 1
          fi
          rm -f "$ERR_FILE"

          NORMALIZED_LANGUAGES=$(echo "$NORMALIZED_JSON" | jq -r '.languages | join(",")')
          ROOT_LANGUAGE=$(echo "$NORMALIZED_JSON" | jq -r '.root_language')
          RELEASE_TYPE=$(echo "$NORMALIZED_JSON" | jq -r '.release_type')
          CODEQL_LANGUAGES=$(echo "$NORMALIZED_JSON" | jq -r '(.codeql_languages // []) | join(",")')

          echo "languages=$LANGUAGES" >> "$GITHUB_OUTPUT"
          echo "normalized_languages=$NORMALIZED_LANGUAGES" >> "$GITHUB_OUTPUT"
          echo "root_language=$ROOT_LANGUAGE" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "codeql_languages=$CODEQL_LANGUAGES" >> "$GITHUB_OUTPUT"
          echo "env_manager=$ENV_MANAGER" >> "$GITHUB_OUTPUT"
          echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate target owner
        uses: ./.github/actions/validate-bootstrap-owner
        with:
          owner: ${{ steps.set-owner.outputs.owner }}
          allowed_repo_owners: ${{ inputs.allowed_repo_owners }}

      - name: Resolve GitHub token
        id: resolve-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.BOOTSTRAP_PROVISIONER_APP_PRIVATE_KEY }}
          app_user_token: ${{ secrets.BOOTSTRAP_PROVISIONER_APP_USER_TOKEN }}
          app_owner: ${{ inputs.app_owner }}
          target_owner: ${{ steps.set-owner.outputs.owner }}
          permission_profile: repository-creation

      - name: Reject internal visibility for personal accounts
        if: steps.resolve-token.outputs.auth_mode == 'app-user' && inputs.visibility == 'internal'
        shell: bash
        run: |
          echo "::error::Internal visibility is supported only for organization repositories; personal-account repositories must use public or private visibility." >&2
          exit 1

      - name: Audit bootstrap request
        uses: ./.github/actions/audit-bootstrap-request
        with:
          owner: ${{ steps.set-owner.outputs.owner }}
          repo_name: ${{ inputs.repo_name }}
          auth_mode: ${{ steps.resolve-token.outputs.auth_mode }}
          gh_token: ${{ steps.resolve-token.outputs.token }}

      - name: Create new repository
        id: create-repo
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          OWNER: ${{ steps.set-owner.outputs.owner }}
          AUTH_MODE: ${{ steps.resolve-token.outputs.auth_mode }}
          VISIBILITY: ${{ inputs.visibility }}
          REPO_NAME: ${{ inputs.repo_name }}
          REPO_DESC: ${{ inputs.repo_description }}
        run: |
          set -euo pipefail
          # Determine if creating under user or organization
          if [ "$AUTH_MODE" = "app-user" ]; then
            ENDPOINT="/user/repos"
          else
            ENDPOINT="/orgs/$OWNER/repos"
          fi

          # Create repository with appropriate visibility
          if [ "$ENDPOINT" = "/user/repos" ]; then
            # User repos: use 'private' field (boolean)
            if [ "$VISIBILITY" = "public" ]; then
              PRIVATE_VALUE=false
            else
              PRIVATE_VALUE=true
            fi

            # Use jq to safely encode all string fields — prevents JSON injection
            jq -n \
              --arg name "$REPO_NAME" \
              --arg description "$REPO_DESC" \
              --argjson private "$PRIVATE_VALUE" \
              '{"name":$name,"description":$description,"private":$private,"has_issues":true,"has_projects":true,"has_wiki":false,"auto_init":true}' | \
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "$ENDPOINT" \
              --input -
          else
            # Organization repos: use 'visibility' field (public/private/internal)
            jq -n \
              --arg name "$REPO_NAME" \
              --arg description "$REPO_DESC" \
              --arg visibility "$VISIBILITY" \
              '{"name":$name,"description":$description,"visibility":$visibility,"has_issues":true,"has_projects":true,"has_wiki":false,"auto_init":true}' | \
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "$ENDPOINT" \
              --input -
          fi
            echo "repo_created=true" >> "$GITHUB_OUTPUT"

      - name: Wait for repository initialization
        run: sleep 5

      - name: Clone new repository
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          OWNER: ${{ steps.set-owner.outputs.owner }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          GIT_AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$GIT_AUTH_HEADER"
          git -c http.extraheader="AUTHORIZATION: basic $GIT_AUTH_HEADER" clone "https://${GH_HOST}/${OWNER}/${REPO_NAME}.git" new-repo
          cd new-repo
          git remote set-url origin "https://${GH_HOST}/${OWNER}/${REPO_NAME}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Copy template files
        run: |
          # Copy all template files and directories
          cp -r templates/* new-repo/
          cp -r templates/.github new-repo/
          cp -r templates/.cursor new-repo/
          cp -r templates/.claude new-repo/

          # Remove template-only helper trees that should not ship in generated repositories.
          rm -rf new-repo/languages new-repo/providers new-repo/.github/workflows/providers new-repo/centralized-actions-workflows

          # Copy root-level dotfiles
          cp templates/.gitignore new-repo/
          cp templates/.gitattributes new-repo/
          cp templates/.commitlintrc.yml new-repo/
          cp templates/.release-please-manifest.json new-repo/
          cp templates/.coderabbit.yaml new-repo/
          cp templates/.prettierrc.yaml new-repo/
          cp templates/.prettierignore new-repo/
          cp templates/.windsurfrules new-repo/
          cp AGENTS.md new-repo/
          cp WORKTREES.md new-repo/

          # Copy .editorconfig from linters to root for IDE integration
          cp templates/.github/linters/.editorconfig new-repo/

      - name: Configure release tool
        run: |
          cd new-repo
          RELEASE_TOOL="${{ inputs.release_tool }}"

          # Files (use rm -f) separated by release tool
          RP_FILES="release-please-config.json .release-please-manifest.json .github/workflows/release-please.yml"
          GC_FILES="cliff.toml .github/workflows/git-cliff-release.yml"

          case "$RELEASE_TOOL" in
            "release-please")
              rm -f $GC_FILES
              echo "Release tool: **release-please** — PR-based semantic versioning (language-aware, ~7k ⭐)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              # Default: git-cliff
              rm -f $RP_FILES
              echo "Release tool: **git-cliff** — tag-triggered changelog + GitHub Release (any language, ~9k ⭐)" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Configure quality profile delivery
        run: |
          cd new-repo
          PROFILE_CAPABILITIES='${{ inputs.profile_capabilities }}'
            PROFILE_CAPABILITIES="${PROFILE_CAPABILITIES:-lint-markdown,lint-json,lint-yaml,lint-shell,lint-python,lint-terraform,lint-format,lint-tests}"
          PROFILE_CAPABILITIES="$(printf '%s' "$PROFILE_CAPABILITIES" | tr -d '[:space:]')"
          DELIVERY_MODE='${{ inputs.delivery_mode }}'
          CENTRAL_REPOSITORY='${{ inputs.central_repository }}'
          CENTRAL_REF='${{ inputs.central_ref }}'
          if [ -z "$CENTRAL_REF" ] && [[ "$CENTRAL_REPOSITORY" == *@* ]]; then
            CENTRAL_REF="${CENTRAL_REPOSITORY##*@}"
            CENTRAL_REPOSITORY="${CENTRAL_REPOSITORY%@*}"
          fi
          if [ "$DELIVERY_MODE" = "embedded" ] && [ -n "$CENTRAL_REPOSITORY" ] && [ -n "$CENTRAL_REF" ]; then
            DELIVERY_MODE=centralized
          fi
          if [ "$DELIVERY_MODE" = "centralized" ]; then
            sed -i \
              -e "s|{{CENTRAL_REPOSITORY}}|$CENTRAL_REPOSITORY|g" \
              -e "s|{{CENTRAL_REF}}|$CENTRAL_REF|g" \
              -e "s|{{QUALITY_CAPABILITIES}}|$PROFILE_CAPABILITIES|g" \
              -e "s|{{ENV_MANAGER}}|${{ steps.validate-inputs.outputs.env_manager }}|g" \
              .github/workflows/centralized-quality.yml
            jq \
              --arg repository "$CENTRAL_REPOSITORY" \
              --arg ref "$CENTRAL_REF" \
              '.delivery_modes.centralized.repository = $repository | .delivery_modes.centralized.ref = $ref' \
              .github/config/bootstrap-profile.json > .github/config/bootstrap-profile.json.tmp
            mv .github/config/bootstrap-profile.json.tmp .github/config/bootstrap-profile.json
            rm -rf .github/actions/quality .github/workflows/quality.yml .github/workflows/quality-capability.yml
            mv .github/workflows/centralized-quality.yml .github/workflows/quality.yml
            echo "✅ Quality implementation centralized at $CENTRAL_REPOSITORY@$CENTRAL_REF" >> "$GITHUB_STEP_SUMMARY"
          else
            sed -i \
              -e "s|{{QUALITY_CAPABILITIES}}|$PROFILE_CAPABILITIES|g" \
              -e "s|{{ENV_MANAGER}}|${{ steps.validate-inputs.outputs.env_manager }}|g" \
              .github/workflows/quality.yml \
              .github/workflows/quality-capability.yml
            rm -f .github/workflows/centralized-quality.yml
            echo "✅ Quality implementation embedded in generated repository" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove unselected workflows
        id: filter-workflows
        run: |
          cd new-repo

          OPTIONAL_FEATURES="${{ inputs.optional_features || 'none' }}"
          case "$OPTIONAL_FEATURES" in
            ""|"none")
              rm -rf .github/ISSUE_TEMPLATE \
                .github/agents/roadmap-prioritizer.agent.md \
                .github/skills/backlog-breakdown \
                .github/skills/github-issue-triage \
                .github/skills/roadmap-prioritization \
                .github/skills/tracker-setup \
                .github/skills/tracker-views \
                .github/workflows/project-status-sync.yml
              echo "✅ Optional GitHub planning assets disabled (default)." >> "$GITHUB_STEP_SUMMARY"
              ;;
            "github-planning")
              echo "✅ Optional GitHub planning assets enabled." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unknown optional feature bundle '$OPTIONAL_FEATURES'. Valid: none,github-planning"
              exit 1
              ;;
          esac

          WORKFLOWS_INPUT="${{ inputs.workflows }}"

          case "$WORKFLOWS_INPUT" in
            "all"|"")
              echo "quality_kept=true" >> "$GITHUB_OUTPUT"
              echo "Keeping all workflows" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          # Build a space-separated list of workflow filenames to keep
          KEEP_FILES=" commit-policy.yml"
          QUALITY_KEPT=false
          RELEASE_KEPT=false
          VALID_WORKFLOW_FOUND=false

          case "$WORKFLOWS_INPUT" in
            "none") VALID_WORKFLOW_FOUND=true ;;
            *)
              IFS=',' read -ra WORKFLOW_NAMES <<< "$WORKFLOWS_INPUT"
              for name in "${WORKFLOW_NAMES[@]}"; do
                name=$(echo "$name" | xargs)
                case "$name" in
                  "quality")        KEEP_FILES="$KEEP_FILES quality.yml"; QUALITY_KEPT=true; VALID_WORKFLOW_FOUND=true ;;
                  "codeql")         KEEP_FILES="$KEEP_FILES codeql.yml"; VALID_WORKFLOW_FOUND=true ;;
                  "ai-code-review") KEEP_FILES="$KEEP_FILES ai-code-review.yml"; VALID_WORKFLOW_FOUND=true ;;
                  "release")
                    VALID_WORKFLOW_FOUND=true
                    RELEASE_KEPT=true
                    case "${{ inputs.release_tool }}" in
                      "release-please")   KEEP_FILES="$KEEP_FILES release-please.yml" ;;
                      *)                  KEEP_FILES="$KEEP_FILES git-cliff-release.yml" ;;
                    esac
                    ;;
                  *)
                    echo "⚠️ Unknown workflow name: '$name' (valid: quality, codeql, ai-code-review, release; commit-policy is always included)" >> "$GITHUB_STEP_SUMMARY"
                    ;;
                esac
              done
              # Fail fast if every supplied name was unrecognised
              if [ "$VALID_WORKFLOW_FOUND" = false ]; then
                echo "❌ No valid workflow names found in '$WORKFLOWS_INPUT'. Valid: quality,codeql,ai-code-review,release" >&2
                exit 1
              fi
              ;;
          esac

          # Delete any workflow file not in the keep list
          for file in .github/workflows/*.yml; do
            filename=$(basename "$file")
            [[ " $KEEP_FILES " == *" $filename "* ]] && continue
            rm -f "$file"
            echo "⏭️ Skipped workflow: $filename" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "quality_kept=$QUALITY_KEPT" >> "$GITHUB_OUTPUT"

          # If the release workflow was not kept, also remove its config files
          if [ "$RELEASE_KEPT" = "false" ]; then
            case "${{ inputs.release_tool }}" in
              "release-please")
                rm -f release-please-config.json .release-please-manifest.json
                echo "⏭️ Removed release-please config files" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                rm -f cliff.toml
                echo "⏭️ Removed git-cliff config file" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          fi

      - name: Configure CODEOWNERS
        env:
          ENABLE_CODEOWNERS: ${{ inputs.enable_codeowners }}
          TEAM_NAME: ${{ inputs.team_name }}
        run: |
          cd new-repo
          case "$ENABLE_CODEOWNERS" in
            "true")
              TEAM_NAME="$TEAM_NAME" python - <<'PY'
          from pathlib import Path
          import os

          path = Path(".github/CODEOWNERS")
          path.write_text(path.read_text().replace("team-leads", os.environ["TEAM_NAME"]))
          PY
              ;;
            *)
              rm -f .github/CODEOWNERS
              echo "⏭️ CODEOWNERS skipped" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Update LICENSE with current year and holder
        env:
          LICENSE_HOLDER: ${{ steps.set-license.outputs.holder }}
        run: |
          cd new-repo
          CURRENT_YEAR=$(date +%Y) LICENSE_HOLDER="$LICENSE_HOLDER" python - <<'PY'
          from pathlib import Path
          import os

          path = Path("LICENSE")
          text = path.read_text()
          text = text.replace("[year]", os.environ["CURRENT_YEAR"])
          path.write_text(text.replace("[fullname]", os.environ["LICENSE_HOLDER"]))
          PY

      - name: Update README with repository details
        env:
          REPOSITORY_OWNER: ${{ steps.set-owner.outputs.owner }}
          REPOSITORY_NAME: ${{ inputs.repo_name }}
        run: |
          cd new-repo
          REPOSITORY_OWNER="$REPOSITORY_OWNER" REPOSITORY_NAME="$REPOSITORY_NAME" python - <<'PY'
          from pathlib import Path
          import os

          path = Path("README.md")
          text = path.read_text().replace("{{REPOSITORY_OWNER}}", os.environ["REPOSITORY_OWNER"])
          path.write_text(text.replace("{{REPOSITORY_NAME}}", os.environ["REPOSITORY_NAME"]))
          PY

      - name: Log language tooling selection
        run: |
          ROOT_LANGUAGE="${{ steps.validate-inputs.outputs.root_language }}"
          RAW_LANGUAGES="${{ steps.validate-inputs.outputs.languages }}"
          ENV_MANAGER="${{ steps.validate-inputs.outputs.env_manager }}"
          if echo "$RAW_LANGUAGES" | grep -q ','; then
            echo "⚠️ Multiple languages provided ($RAW_LANGUAGES). Tooling template uses first language policy: $ROOT_LANGUAGE" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Using language template: $ROOT_LANGUAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Using environment manager: $ENV_MANAGER" >> "$GITHUB_STEP_SUMMARY"

      - name: Render pre-commit configs
        uses: ./.github/actions/render-precommit-configs
        with:
          root_language: ${{ steps.validate-inputs.outputs.root_language }}
          languages: ${{ steps.validate-inputs.outputs.normalized_languages }}

      - name: Configure provider tooling files
        uses: ./.github/actions/configure-provider-tooling-files
        with:
          root_language: ${{ steps.validate-inputs.outputs.root_language }}
          env_manager: ${{ steps.validate-inputs.outputs.env_manager }}
          repo_name: ${{ inputs.repo_name }}
          python_version: ${{ steps.validate-inputs.outputs.python_version }}
          node_version: ${{ steps.validate-inputs.outputs.node_version }}
          go_version: ${{ steps.validate-inputs.outputs.go_version }}
          java_version: ${{ steps.validate-inputs.outputs.java_version }}

      - name: Configure Release Please for selected languages
        uses: ./.github/actions/configure-release-tool
        with:
          release_tool: ${{ inputs.release_tool }}
          release_type: ${{ steps.validate-inputs.outputs.release_type }}

      - name: Configure CodeQL for selected languages
        uses: ./.github/actions/configure-codeql
        with:
          codeql_input_languages: ${{ steps.validate-inputs.outputs.codeql_languages }}

      - name: Commit and push files
        id: push-files
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        run: |
          cd new-repo
          git add .
          git commit -m "chore: initialize repository from bootstrap template"
          GIT_AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$GIT_AUTH_HEADER"
          git -c http.extraheader="AUTHORIZATION: basic $GIT_AUTH_HEADER" push
          echo "✅ Template files pushed" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply repository settings
        uses: ./.github/actions/apply-repo-settings
        with:
          owner: ${{ steps.set-owner.outputs.owner }}
          repo_name: ${{ inputs.repo_name }}
          enable_repo_settings: ${{ inputs.enable_repo_settings }}
          gh_token: ${{ steps.resolve-token.outputs.token }}

      - name: Apply repository ruleset
        uses: ./.github/actions/apply-repository-ruleset
        with:
          owner: ${{ steps.set-owner.outputs.owner }}
          repo_name: ${{ inputs.repo_name }}
          gh_token: ${{ steps.resolve-token.outputs.token }}
          required_status_checks: ${{ steps.filter-workflows.outputs.quality_kept == 'true' && 'Signed-off-by trailers,quality' || 'Signed-off-by trailers' }}

      - name: Summary
        run: |
          echo "✅ Repository created successfully!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Repository:** https://github.com/${{ steps.set-owner.outputs.owner }}/${{ inputs.repo_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Visibility:** ${{ inputs.visibility }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Languages:** ${{ steps.validate-inputs.outputs.languages }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment manager:** ${{ steps.validate-inputs.outputs.env_manager }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Runtime versions:** python=${{ steps.validate-inputs.outputs.python_version }}, node=${{ steps.validate-inputs.outputs.node_version }}, go=${{ steps.validate-inputs.outputs.go_version }}, java=${{ steps.validate-inputs.outputs.java_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release tool:** ${{ inputs.release_tool || 'git-cliff' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Created Resources" >> "$GITHUB_STEP_SUMMARY"

          case "${{ inputs.enable_codeowners }}" in
            "true") echo "- ✅ CODEOWNERS" >> "$GITHUB_STEP_SUMMARY" ;;
            *)      echo "- ⏭️ CODEOWNERS (skipped)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

          case "${{ inputs.enable_repo_settings }}" in
            "true")
              echo "- ✅ Vulnerability alerts and Dependabot security updates enabled" >> "$GITHUB_STEP_SUMMARY"
              echo "- ✅ Repository ruleset applied (or skipped with warning on unsupported plans)" >> "$GITHUB_STEP_SUMMARY"
              echo "- ✅ Development environment" >> "$GITHUB_STEP_SUMMARY"
              echo "- ✅ Production environment" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "- ⏭️ Vulnerability alerts and Dependabot security updates (skipped; enable_repo_settings=false)" >> "$GITHUB_STEP_SUMMARY"
              echo "- ✅ Repository ruleset applied (or skipped with warning on unsupported plans)" >> "$GITHUB_STEP_SUMMARY"
              echo "- ⏭️ Development environment (skipped; enable_repo_settings=false)" >> "$GITHUB_STEP_SUMMARY"
              echo "- ⏭️ Production environment (skipped; enable_repo_settings=false)" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

          echo "- ✅ Dependabot configuration" >> "$GITHUB_STEP_SUMMARY"

          echo "- ✅ .editorconfig (4 spaces code, 2 spaces config)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ .gitignore, .gitattributes" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Documentation templates" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ SECURITY.md (security policy)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ CONTRIBUTING.md (contribution guide)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ LICENSE (MIT)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f new-repo/environment.yml ]; then
            echo "- ✅ provider/micromamba config selected (environment.yml)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f new-repo/mise.toml ]; then
            echo "- ✅ provider/mise config selected (mise.toml)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ provider/system config selected (Makefile only)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- ✅ .pre-commit-config.yaml (all language: system hooks)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Conventional commits (pre-commit)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Makefile (run 'make quality' locally)" >> "$GITHUB_STEP_SUMMARY"

          case "${{ inputs.workflows }}" in
            "all"|"")
              echo "- ✅ Quality workflow (${{ steps.validate-inputs.outputs.env_manager }} + selected capabilities)" >> "$GITHUB_STEP_SUMMARY"
              case "${{ inputs.release_tool }}" in
                "release-please")
                  echo "- ✅ Release Please workflow (PR-based semantic versioning)" >> "$GITHUB_STEP_SUMMARY"
                  ;;
                *)
                  echo "- ✅ git-cliff release workflow (tag-based changelog + GitHub Release)" >> "$GITHUB_STEP_SUMMARY"
                  echo "- ✅ cliff.toml (changelog configuration)" >> "$GITHUB_STEP_SUMMARY"
                  ;;
              esac
              ;;
            "none")
              echo "- ⏭️ All workflows skipped" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "- ✅ Selected workflows: ${{ inputs.workflows }}" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

  cleanup-approval:
    name: Await Cleanup Approval
    runs-on: ubuntu-latest
    needs: create-repository
    if: >-
      always() &&
      needs.create-repository.outputs.repo_created == 'true' &&
      needs.create-repository.result == 'failure' &&
      inputs.cleanup_on_failure == true &&
      (inputs.require_cleanup_approval == true || github.event_name == 'workflow_dispatch')
    permissions: {}
    # Create this environment in repository settings and add required reviewers
    # to enforce manual approval for destructive cleanup.
    environment: bootstrap-cleanup
    steps:
      - name: Await approval
        run: echo "Cleanup approval granted."

  teardown-with-approval:
    name: Cleanup Repository (Approved)
    runs-on: ubuntu-latest
    needs:
      - create-repository
      - cleanup-approval
    env:
      GH_HOST: ${{ inputs.github_host || 'github.com' }}
    # Only cleanup if repo was created AND (creation failed AND cleanup is enabled)
    if: >-
      always() &&
      needs.create-repository.outputs.repo_created == 'true' &&
      needs.create-repository.result == 'failure' &&
      inputs.cleanup_on_failure == true &&
      (inputs.require_cleanup_approval == true || github.event_name == 'workflow_dispatch') &&
      needs.cleanup-approval.result == 'success'
    permissions:
      contents: read

    steps:
      - name: Resolve bootstrap repository
        id: bootstrap-repo
        shell: bash
        run: |
          REPO=$(printf '%s' '${{ github.workflow_ref }}' | cut -d'/' -f1,2)
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout bootstrap repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: ${{ steps.bootstrap-repo.outputs.repository }}
          ref: ${{ github.workflow_sha }}

      - name: Resolve GitHub token
        id: resolve-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.BOOTSTRAP_PROVISIONER_APP_PRIVATE_KEY }}
          app_user_token: ${{ secrets.BOOTSTRAP_PROVISIONER_APP_USER_TOKEN }}
          app_owner: ${{ inputs.app_owner }}
          target_owner: ${{ needs.create-repository.outputs.owner }}
          permission_profile: repository-cleanup
          repositories: ${{ inputs.repo_name }}

      - name: Delete repository on failure
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          OWNER: ${{ needs.create-repository.outputs.owner }}
          REPO: ${{ inputs.repo_name }}
        run: |
          # Check if repository exists before attempting deletion
          if gh repo view "$OWNER/$REPO" &>/dev/null; then
            echo "🗑️ Deleting repository $OWNER/$REPO due to failure..." >> "$GITHUB_STEP_SUMMARY"

            # Delete the repository
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/$OWNER/$REPO

            echo "✅ Repository deleted successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Repository does not exist, nothing to clean up" >> "$GITHUB_STEP_SUMMARY"
          fi

  teardown-no-approval:
    name: Cleanup Repository (No Approval)
    runs-on: ubuntu-latest
    needs: create-repository
    env:
      GH_HOST: ${{ inputs.github_host || 'github.com' }}
    if: >-
      always() &&
      needs.create-repository.outputs.repo_created == 'true' &&
      needs.create-repository.result == 'failure' &&
      inputs.cleanup_on_failure == true &&
      inputs.require_cleanup_approval == false && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Resolve bootstrap repository
        id: bootstrap-repo
        shell: bash
        run: |
          REPO=$(printf '%s' '${{ github.workflow_ref }}' | cut -d'/' -f1,2)
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout bootstrap repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: ${{ steps.bootstrap-repo.outputs.repository }}
          ref: ${{ github.workflow_sha }}

      - name: Resolve GitHub token
        id: resolve-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ inputs.client_id }}
          app_private_key: ${{ secrets.BOOTSTRAP_PROVISIONER_APP_PRIVATE_KEY }}
          app_user_token: ${{ secrets.BOOTSTRAP_PROVISIONER_APP_USER_TOKEN }}
          app_owner: ${{ inputs.app_owner }}
          target_owner: ${{ needs.create-repository.outputs.owner }}
          permission_profile: repository-cleanup
          repositories: ${{ inputs.repo_name }}

      - name: Delete repository on failure
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          OWNER: ${{ needs.create-repository.outputs.owner }}
          REPO: ${{ inputs.repo_name }}
        run: |
          # Check if repository exists before attempting deletion
          if gh repo view "$OWNER/$REPO" &>/dev/null; then
            echo "🗑️ Deleting repository $OWNER/$REPO due to failure..." >> "$GITHUB_STEP_SUMMARY"

            # Delete the repository
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/$OWNER/$REPO

            echo "✅ Repository deleted successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Repository does not exist, nothing to clean up" >> "$GITHUB_STEP_SUMMARY"
          fi
