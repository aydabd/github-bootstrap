name: Merge Maintenance Pull Request

on:
  pull_request_target:
    types: [labeled]
  repository_dispatch:
    types: [maintenance-reconcile]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - Maintenance safety
      - Verify Conda Lockfiles
      - Quality
      - Commit policy
      - Test Quality Providers
      - CodeQL Security Scan
      - Test Generated Repository E2E
    types: [completed]

concurrency:
  group: >-
    maintenance-merge-${{ github.repository }}-${{
    github.event.pull_request.number ||
    github.event.workflow_run.pull_requests[0].number ||
    github.event.client_payload.pr_number ||
    github.event.workflow_run.head_sha ||
    github.event.client_payload.head_sha ||
    'reconcile' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  reconcile:
    if: github.event_name == 'schedule'
    name: Dispatch maintenance reconciliation
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout token resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: .github/actions/resolve-gh-token/action.yml

      - name: Resolve Writer App dispatch token
        id: resolve-merge-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ vars.BOOTSTRAP_PRODUCTION_WRITER_APP_CLIENT_ID }}
          refresh_token_secret: ""
          app_private_key: ${{ secrets.BOOTSTRAP_PRODUCTION_WRITER_APP_PRIVATE_KEY }}
          app_owner: ${{ github.repository_owner }}
          target_owner: ${{ github.repository_owner }}
          permission_profile: maintenance-merge
          repositories: ${{ github.event.repository.name }}

      - name: Dispatch reconciliation for accepted maintenance PRs
        env:
          GH_TOKEN: ${{ steps.resolve-merge-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          accepted_prs="$(gh api "/repos/$REPOSITORY/pulls?state=open&base=main&per_page=100" |
            jq -c '[.[] | select(any(.labels[]?.name; . == "automation: accepted")) |
              {number, head_sha: .head.sha, head_branch: .head.ref}]')"
          dispatched=0
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            payload="$(jq -c '{pr_number: .number, head_sha: .head_sha, head_branch: .head_branch}' <<< "$pr")"
            gh api --method POST "/repos/$REPOSITORY/dispatches" \
              -f event_type=maintenance-reconcile \
              -f client_payload="$payload" > /dev/null
            dispatched=$((dispatched + 1))
            echo "dispatched maintenance reconciliation for PR $(jq -r '.number' <<< "$pr")"
          done < <(jq -c '.[]' <<< "$accepted_prs")
          echo "dispatched $dispatched maintenance reconciliation event(s)"

  merge:
    if: >-
      (github.event_name == 'pull_request_target' &&
      github.event.label.name == 'automation: accepted') ||
      (github.event_name == 'repository_dispatch' &&
      github.event.action == 'maintenance-reconcile' &&
      github.event.client_payload.pr_number) ||
      (github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != 'main')
    name: Approve and enable squash auto-merge
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout validation helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            .github/actions/resolve-gh-token/action.yml
            scripts/github-setup/gh-common.sh
            scripts/github-setup/validate-app-auth.sh
            scripts/github-setup/validate-maintenance-merge.sh
            .github/config/maintenance-e2e.json

      - name: Resolve Reviewer App token
        id: resolve-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ vars.BOOTSTRAP_PRODUCTION_REVIEWER_APP_CLIENT_ID }}
          refresh_token_secret: ""
          app_private_key: ${{ secrets.BOOTSTRAP_PRODUCTION_REVIEWER_APP_PRIVATE_KEY }}
          app_owner: ${{ github.repository_owner }}
          target_owner: ${{ github.repository_owner }}
          permission_profile: maintenance-review
          repositories: ${{ github.event.repository.name }}

      - name: Verify resolved Reviewer App identity
        env:
          APP_SLUG: ${{ steps.resolve-token.outputs.app_slug }}
          EXPECTED_APP_SLUG: ${{ vars.BOOTSTRAP_PRODUCTION_REVIEWER_APP_SLUG }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$APP_SLUG" ] || { echo "Reviewer App slug was not resolved" >&2; exit 1; }
          [ -n "$EXPECTED_APP_SLUG" ] || { echo "Expected maintenance Reviewer App slug is not configured" >&2; exit 1; }
          [ "$APP_SLUG" = "$EXPECTED_APP_SLUG" ] || { echo "Resolved App is not the configured maintenance Reviewer" >&2; exit 1; }

      # Merging needs contents:write, which the Reviewer App does not carry;
      # the Writer App does. The Reviewer still owns the approval.
      - name: Resolve Writer App merge token
        id: resolve-merge-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ vars.BOOTSTRAP_PRODUCTION_WRITER_APP_CLIENT_ID }}
          refresh_token_secret: ""
          app_private_key: ${{ secrets.BOOTSTRAP_PRODUCTION_WRITER_APP_PRIVATE_KEY }}
          app_owner: ${{ github.repository_owner }}
          target_owner: ${{ github.repository_owner }}
          permission_profile: maintenance-merge
          repositories: ${{ github.event.repository.name }}

      - name: Approve and enable squash auto-merge after fresh validation
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          MERGE_TOKEN: ${{ steps.resolve-merge-token.outputs.token }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
          TRIGGER_PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.pr_number || '' }}
          TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.client_payload.head_sha || '' }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || github.event.client_payload.head_branch || '' }}
          WRITER_APP_SLUG: ${{ vars.BOOTSTRAP_PRODUCTION_WRITER_APP_SLUG }}
          REVIEWER_APP_SLUG: ${{ steps.resolve-token.outputs.app_slug }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$HEAD_BRANCH" ] || { echo "maintenance trigger has no head branch" >&2; exit 1; }
          [ -n "$TRIGGER_HEAD_SHA" ] || { echo "maintenance trigger has no head SHA" >&2; exit 1; }

          # Conda pull_request runs carry the exact PR number. Safety runs
          # created from pull_request_target do not, so resolve their one open
          # same-owner PR by exact branch and verify its SHA below.
          if [ -n "$TRIGGER_PR_NUMBER" ]; then
            PR_NUMBER="$TRIGGER_PR_NUMBER"
          else
            # shellcheck disable=SC2016 # jq program is intentionally literal.
            PR_NUMBER="$(gh api --method GET "repos/$REPOSITORY/pulls" \
              -f head="${REPOSITORY%%/*}:$HEAD_BRANCH" -f base=main -f state=open \
              --jq 'if length == 1 then .[0].number else empty end')"
          fi
          [ -n "$PR_NUMBER" ] || {
            echo "no unique open pull request for maintenance trigger; deferring"
            exit 0
          }
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')"
          [ -n "$HEAD_SHA" ] || { echo "could not resolve the pull request head SHA" >&2; exit 1; }
          [ "$TRIGGER_HEAD_SHA" = "$HEAD_SHA" ] || {
            echo "Maintenance trigger validated $TRIGGER_HEAD_SHA but the PR head is now $HEAD_SHA; deferring to the next run"
            exit 0
          }

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          capability_file="$GITHUB_WORKSPACE/.github/config/maintenance-e2e.json"
          e2e_runs_file="$tmp_dir/e2e.json"
          jq -e 'type == "object" and .schema_version == 1 and (.enabled | type) == "boolean" and (.workflow | type) == "string" and ((.enabled and (.workflow | length > 0)) or ((.enabled | not) and .workflow == ""))' "$capability_file" > /dev/null || {
            echo "maintenance E2E capability config is malformed" >&2
            exit 1
          }
          fetch_state() {
            gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER" > "$tmp_dir/pr.json"
            gh pr checks "$PR_NUMBER" --required --json name,state > "$tmp_dir/checks.json" || true
            gh api "/repos/$REPOSITORY/issues/$PR_NUMBER/labels?per_page=100" > "$tmp_dir/labels.json"
            if jq -e 'any(.[]?; .name == "automation: breaking")' "$tmp_dir/labels.json" > /dev/null &&
              jq -e '.enabled == true' "$capability_file" > /dev/null; then
              e2e_workflow="$(jq -r '.workflow' "$capability_file")"
              gh api --paginate "/repos/$REPOSITORY/actions/workflows/$e2e_workflow/runs?per_page=100" \
                --jq '.workflow_runs[] | {status,conclusion,head_sha}' | jq -s '.' > "$e2e_runs_file"
            else
              printf '%s\n' '[]' > "$e2e_runs_file"
            fi
            gh api --paginate --slurp "/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" > "$tmp_dir/review-pages.json"
            jq '[.[][]]' "$tmp_dir/review-pages.json" > "$tmp_dir/reviews.json"
          }

          validate_state() {
            local require_reviewer_approval="${1:-false}"
            fetch_state
            bash scripts/github-setup/validate-maintenance-merge.sh \
              "$tmp_dir/pr.json" "$tmp_dir/checks.json" "$tmp_dir/reviews.json" \
              "$tmp_dir/labels.json" "$REPOSITORY" "$HEAD_SHA" \
              "$WRITER_APP_SLUG" "$REVIEWER_APP_SLUG" "$require_reviewer_approval" \
              "$e2e_runs_file" "$capability_file"
          }

          wait_until_safety_check() {
            local timeout_seconds=60 deadline maintenance_safety_state
            deadline=$((SECONDS + timeout_seconds))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if ! maintenance_safety_state="$(gh pr checks "$PR_NUMBER" --json name,state \
                --jq '[.[] | select(.name == "Maintenance safety") | .state] | last // "MISSING"' 2>/dev/null)"; then
                maintenance_safety_state=MISSING
              fi
              case "$maintenance_safety_state" in
                SUCCESS)
                  return 0
                  ;;
                FAILURE|ERROR|CANCELLED|SKIPPED)
                  return 1
                  ;;
                *)
                  sleep 5
                  ;;
              esac
            done
            return 1
          }

          # A direct Conda completion can race the safety run it triggers. Wait
          # for the same PR's safety check, not for an unrelated workflow run.
          if [ "$TRIGGER_WORKFLOW" = "Verify Conda Lockfiles" ] &&
            ! wait_until_safety_check; then
            echo "Maintenance safety is not successful for this PR; deferring" >&2
            exit 0
          fi
          if ! validate_state; then
            echo "maintenance merge preconditions are not met; not enabling auto-merge" >&2
            exit 0
          fi
          reviewer_login="${REVIEWER_APP_SLUG}[bot]"
          approval_submitted=false
          if ! jq -e --arg reviewer_login "$reviewer_login" --arg head_sha "$HEAD_SHA" \
              'any(.[]?; .user.login == $reviewer_login and .state == "APPROVED" and .commit_id == $head_sha)' \
              "$tmp_dir/reviews.json" > /dev/null; then
            gh api --method POST "/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
              -f event=APPROVE \
              -f commit_id="$HEAD_SHA" \
              -f body="Maintenance gates passed for $HEAD_SHA; approved by the Reviewer App."
            approval_submitted=true
          fi

          if [ "$approval_submitted" = true ]; then
            payload="$(jq -nc --arg pr_number "$PR_NUMBER" --arg head_sha "$HEAD_SHA" --arg head_branch "$HEAD_BRANCH" \
              '{pr_number: ($pr_number | tonumber), head_sha: $head_sha, head_branch: $head_branch}')"
            echo "Dispatch post-approval reconciliation for $REPOSITORY#$PR_NUMBER"
            GH_TOKEN="$MERGE_TOKEN" gh api --method POST "/repos/$REPOSITORY/dispatches" \
              -f event_type=maintenance-reconcile \
              -f client_payload="$payload" > /dev/null
            exit 0
          fi

          validate_state true

          enable_native_auto_merge() {
            local allow_auto_merge pull_request_node_id
            allow_auto_merge="$(GH_TOKEN="$MERGE_TOKEN" gh api "/repos/$REPOSITORY" --jq '.allow_auto_merge // false')"
            if [ "$allow_auto_merge" != "true" ]; then
              echo "native auto-merge is unavailable; using direct merge fallback" >&2
              return 1
            fi
            if ! pull_request_node_id="$(GH_TOKEN="$MERGE_TOKEN" gh api \
              "/repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.node_id')"; then
              echo "native auto-merge request failed: could not resolve pull request node ID" >&2
              return 1
            fi
            # shellcheck disable=SC2016 # GraphQL document is intentionally literal.
            if ! GH_TOKEN="$MERGE_TOKEN" gh api graphql \
              -f query='mutation($pullRequestId:ID!,$mergeMethod:PullRequestMergeMethod!,$expectedHeadOid:GitObjectID){enablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId,mergeMethod:$mergeMethod,expectedHeadOid:$expectedHeadOid}){pullRequest{id}}}' \
              -f pullRequestId="$pull_request_node_id" \
              -f mergeMethod=SQUASH \
              -f expectedHeadOid="$HEAD_SHA" > "$tmp_dir/auto-merge.json" ||
              ! jq -e '.data.enablePullRequestAutoMerge.pullRequest.id != null' "$tmp_dir/auto-merge.json" > /dev/null; then
              echo "native auto-merge request failed; using protected direct merge fallback" >&2
              return 1
            fi
            echo "native auto-merge enabled for $REPOSITORY#$PR_NUMBER at $HEAD_SHA"
            return 0
          }

          attempt_merge() {
            local current_head_sha mergeable_state deadline

            if ! current_head_sha="$(gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"; then
              echo "could not re-read pull request head; deferring" >&2
              return 0
            fi
            if [ "$current_head_sha" != "$HEAD_SHA" ]; then
              echo "pull request head changed during merge preparation; deferring" >&2
              return 0
            fi

            # No event exists for "mergeable_state finished computing".
            deadline=$((SECONDS + 30))
            if ! mergeable_state="$(gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.mergeable_state // "unknown"')"; then
              echo "could not read mergeable state; deferring" >&2
              return 0
            fi
            while [ "$mergeable_state" = "unknown" ] && [ "$SECONDS" -lt "$deadline" ]; do
              sleep 5
              if ! mergeable_state="$(gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.mergeable_state // "unknown"')"; then
                echo "could not read mergeable state; deferring" >&2
                return 0
              fi
            done

            case "$mergeable_state" in
              clean)
                GH_TOKEN="$MERGE_TOKEN" gh api --method PUT \
                  "/repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
                  -f sha="$HEAD_SHA" -f merge_method=squash > /dev/null
                ;;
              behind)
                echo "pull request is behind $REPOSITORY main; updating the branch" >&2
                GH_TOKEN="$MERGE_TOKEN" gh api --method PUT \
                  "/repos/$REPOSITORY/pulls/$PR_NUMBER/update-branch" \
                  -f expected_head_sha="$HEAD_SHA" > /dev/null
                echo "branch update requested; deferring to the checks it triggers" >&2
                ;;
              dirty)
                echo "pull request has merge conflicts with main" >&2
                return 1
                ;;
              *)
                echo "mergeable_state=$mergeable_state; deferring to the next trigger" >&2
                ;;
            esac
          }

          if ! enable_native_auto_merge; then
            attempt_merge
          fi
