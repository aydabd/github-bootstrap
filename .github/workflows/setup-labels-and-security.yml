name: Setup Labels and Security

on:
  workflow_dispatch:
    inputs:
      repo_owner:
        description: "Target owner - GitHub user or organization"
        required: true
        type: string
      repo_name:
        description: "Existing repository name"
        required: true
        type: string
      label_policy:
        description: "Label apply policy"
        required: false
        default: create-and-update
        type: choice
        options:
          - create-missing
          - create-and-update
      client_id:
        description: "GitHub App client ID"
        required: true
        type: string
      app_owner:
        description: "Organization whose GitHub App installation token should be used"
        required: true
        type: string
      allowed_repo_owners:
        description: "Comma-separated allowlist of target owners"
        required: true
        type: string
  workflow_call:
    inputs:
      repo_owner:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      label_policy:
        required: false
        default: create-and-update
        type: string
      client_id:
        required: true
        type: string
      app_owner:
        required: true
        type: string
      allowed_repo_owners:
        required: true
        type: string
    secrets:
      BOOTSTRAP_PROVISIONER_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  setup-labels-and-security:
    uses: ./.github/workflows/setup-existing-repository.yml
    with:
      repo_owner: ${{ inputs.repo_owner }}
      repo_name: ${{ inputs.repo_name }}
      apply_labels: true
      apply_security_settings: true
      label_policy: ${{ inputs.label_policy }}
      client_id: ${{ inputs.client_id }}
      app_owner: ${{ inputs.app_owner || inputs.repo_owner }}
      allowed_repo_owners: ${{ inputs.allowed_repo_owners }}
    secrets: inherit
