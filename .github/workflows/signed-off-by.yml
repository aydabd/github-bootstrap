name: Signed-off-by trailers

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: signed-off-by-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-off-by:
    name: Signed-off-by trailers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # Required to read pull-request commits and verify trailers.
    steps:
      - name: Verify Signed-off-by trailers
        uses: ./.github/actions/verify-signed-off-by
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
