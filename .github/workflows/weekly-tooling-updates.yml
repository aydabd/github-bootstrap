name: Weekly Tooling Updates

on:
  # Create or reconcile the single tooling PR on the weekly cadence.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      explicit_breaking:
        description: "Treat this maintenance update as explicitly breaking"
        required: false
        default: false
        type: boolean

concurrency:
  group: weekly-tooling-updates
  cancel-in-progress: true

jobs:
  update-tooling:
    name: Update non-Dependabot tooling
    runs-on: ubuntu-latest
    environment: production-maintenance
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Install updater dependencies
        shell: bash
        run: python -m pip install --upgrade pip pre-commit

      - name: Resolve GitHub App token
        id: resolve-token
        uses: ./.github/actions/resolve-gh-token
        with:
          client_id: ${{ vars.BOOTSTRAP_MAINTENANCE_WRITER_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.BOOTSTRAP_MAINTENANCE_WRITER_APP_PRIVATE_KEY }}
          app_owner: ${{ github.repository_owner }}
          target_owner: ${{ github.repository_owner }}
          permission_profile: weekly-tooling
          repositories: ${{ github.event.repository.name }}
      - name: Verify resolved App identity
        env:
          APP_SLUG: ${{ steps.resolve-token.outputs.app_slug }}
          EXPECTED_APP_SLUG: ${{ vars.BOOTSTRAP_MAINTENANCE_WRITER_APP_SLUG }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$APP_SLUG" ] || { echo "GitHub App slug was not resolved" >&2; exit 1; }
          [ -n "$EXPECTED_APP_SLUG" ] || { echo "Expected maintenance Writer App slug is not configured" >&2; exit 1; }
          [ "$APP_SLUG" = "$EXPECTED_APP_SLUG" ] || { echo "Resolved App is not the configured maintenance Writer" >&2; exit 1; }

      - name: Verify Maintenance Writer installation access
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          installation_repositories="$(mktemp)"
          trap 'rm -f "$installation_repositories"' EXIT
          gh api --paginate --slurp /installation/repositories >"$installation_repositories"
          target_access="$(jq -c --arg target "$TARGET_REPOSITORY" \
            '[.[] | .repositories[] | select(.full_name == $target) | {full_name}] | .[0] // empty' \
            "$installation_repositories")"
          [ -n "$target_access" ] || {
            echo "Maintenance Writer installation cannot see $TARGET_REPOSITORY" >&2
            exit 1
          }
          printf '%s\n' "$target_access" >"$installation_repositories"
          echo "Maintenance Writer repository access: $(jq -c . "$installation_repositories")"
          main_sha="$(gh api "/repos/$TARGET_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ -n "$main_sha" ] || {
            echo "Maintenance Writer installation cannot read the main ref" >&2
            exit 1
          }
          gh api "/repos/$TARGET_REPOSITORY/git/commits/$main_sha" --jq '.sha' | grep -Fxq "$main_sha" || {
            echo "Maintenance Writer installation cannot read the main commit object" >&2
            exit 1
          }
          echo "Maintenance Writer installation can read $TARGET_REPOSITORY at main ($main_sha)."

      - name: Update repository and template tooling
        env:
          TOOLING_UPDATE_METADATA_FILE: ${{ runner.temp }}/tooling-update-metadata.json
          TOOLING_UPDATE_EXPLICIT_BREAKING: ${{ inputs.explicit_breaking || false }}
        shell: bash
        run: |
          ENV_MANAGER=micromamba make tooling-update-repo
          ENV_MANAGER=micromamba make tooling-update-templates

      - name: Normalize generated files
        shell: bash
        run: |
          ENV_MANAGER=micromamba make quality || true
          LINT_MODE=check ENV_MANAGER=micromamba make quality

      - name: Create or update tooling update PR (gh CLI)
        shell: bash
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          APP_SLUG: ${{ steps.resolve-token.outputs.app_slug }}
          TOOLING_UPDATE_METADATA_FILE: ${{ runner.temp }}/tooling-update-metadata.json
        run: |
          set -euo pipefail

          branch="chore/weekly-tooling-updates"
          title="chore(deps): weekly tooling updates"
          signoff_name="$GITHUB_ACTOR"
          signoff_email="${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          commit_headline="chore(deps): update non-dependabot tooling pins"
          commit_body="X-GitHub-Bootstrap-Automation: weekly-tooling-updates
          Signed-off-by: ${signoff_name} <${signoff_email}>"
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"

          cat > /tmp/weekly-tooling-pr-body.md <<'EOF'
          ## Summary
          - update non-Dependabot-managed tooling versions for this repository
          - update tooling versions in templates used for generated repositories
          - refresh pre-commit hook revisions via `pre-commit autoupdate`

          ## Auto-merge
          Auto-merge is requested only for fully classified updates. GitHub will merge only
          after all required checks, CodeRabbit review requirements, and approval rules are satisfied.
          EOF

          if git diff --quiet --exit-code && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No tooling updates detected; skipping PR creation."
            exit 0
          fi

          metadata_file="$TOOLING_UPDATE_METADATA_FILE"
          [ -s "$metadata_file" ] || {
            echo "tooling update metadata is missing" >&2
            exit 1
          }
          bash ./scripts/github-setup/validate-tooling-metadata.sh "$metadata_file"
          jq -r '.updates[] | "- `\(.package)`: \(.old_version) -> \(.new_version) (\(.update_type), \(.risk))"' "$metadata_file" >> /tmp/weekly-tooling-pr-body.md
          printf '\nMachine-readable metadata is generated in the workflow runner and is not committed.\n' >> /tmp/weekly-tooling-pr-body.md

          payload_dir="$(mktemp -d)"
          file_changes="$payload_dir/file-changes.json"
          repo_state="$payload_dir/repo-state.json"
          create_commit_payload="$payload_dir/create-commit.json"
          create_commit_response="$payload_dir/create-commit-response.json"
          trap 'rm -rf "$payload_dir"' EXIT

          git add -A
          jq -n '{additions: [], deletions: []}' >"$file_changes"
          while IFS= read -r path; do
            if git diff --cached --diff-filter=D --name-only | grep -Fxq -- "$path"; then
              jq --arg path "$path" \
                '.deletions += [{path: $path}]' \
                "$file_changes" >"$file_changes.tmp"
            else
              mode="$(git ls-files -s -- "$path" | awk 'NR == 1 { print $1 }')"
              [ "$mode" = "100644" ] || {
                echo "weekly tooling update contains unsupported file mode $mode: $path" >&2
                exit 1
              }
              encoded_content="$(base64 <"$path" | tr -d '\n')"
              jq --arg path "$path" --arg contents "$encoded_content" \
                '.additions += [{path: $path, contents: $contents}]' \
                "$file_changes" >"$file_changes.tmp"
            fi
            mv "$file_changes.tmp" "$file_changes"
          done < <(git diff --cached --name-only)

          # Resolve the repository node id and any existing automation branch
          # through GraphQL. Creating and updating the ref on the same GraphQL
          # endpoint that runs createCommitOnBranch avoids the REST-to-GraphQL
          # propagation gap that made the mutation fail with "Branch not found".
          gh api graphql \
            -f query='query($owner: String!, $name: String!, $branchRef: String!) {
              repository(owner: $owner, name: $name) {
                id
                branchRef: ref(qualifiedName: $branchRef) {
                  id
                  target {
                    oid
                    ... on Commit { message }
                  }
                }
              }
            }' \
            -f owner="$owner" \
            -f name="$name" \
            -f branchRef="refs/heads/$branch" \
            >"$repo_state"

          repository_id="$(jq -r '.data.repository.id // empty' "$repo_state")"
          branch_ref_id="$(jq -r '.data.repository.branchRef.id // empty' "$repo_state")"
          branch_commit_message="$(jq -r '.data.repository.branchRef.target.message // empty' "$repo_state")"
          [ -n "$repository_id" ] || {
            echo "weekly tooling workflow could not resolve the repository node id" >&2
            exit 1
          }

          # Resolve the tip of main now, immediately before the branch is reset
          # and the commit is created, so createRef / updateRef /
          # createCommitOnBranch all pin the same current commit rather than a
          # value that aged while the updater ran.
          base_oid="$(gh api graphql \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                ref(qualifiedName: "refs/heads/main") { target { oid } }
              }
            }' \
            -f owner="$owner" \
            -f name="$name" \
            --jq '.data.repository.ref.target.oid')"
          [ -n "$base_oid" ] || {
            echo "weekly tooling workflow could not resolve the refs/heads/main tip" >&2
            exit 1
          }

          # Idempotency guard. The updater ran against the checked-out tree and
          # the commit below replaces whole files, so on the scheduled/main path
          # the checkout must still be the tip of main. If something merged
          # mid-run, abort and let the next run reconcile from a fresh checkout
          # rather than silently reverting that change.
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            checkout_sha="$(git rev-parse HEAD)"
            [ "$checkout_sha" = "$base_oid" ] || {
              echo "main advanced during the run (updater base $checkout_sha, current tip $base_oid); aborting for a clean reconcile on the next run" >&2
              exit 1
            }
          fi

          if [ -z "$branch_ref_id" ]; then
            gh api graphql \
              -f query='mutation($repositoryId: ID!, $name: String!, $oid: GitObjectID!) {
                createRef(input: {repositoryId: $repositoryId, name: $name, oid: $oid}) { ref { id } }
              }' \
              -f repositoryId="$repository_id" \
              -f name="refs/heads/$branch" \
              -f oid="$base_oid" \
              >"$payload_dir/create-ref.json"
          else
            printf '%s\n' "$branch_commit_message" | grep -Fqx 'X-GitHub-Bootstrap-Automation: weekly-tooling-updates' || {
              echo "Weekly tooling branch is not owned by this automation; refusing to update it" >&2
              exit 1
            }
            gh api graphql \
              -f query='mutation($refId: ID!, $oid: GitObjectID!) {
                updateRef(input: {refId: $refId, oid: $oid, force: true}) { ref { id } }
              }' \
              -f refId="$branch_ref_id" \
              -f oid="$base_oid" \
              >"$payload_dir/update-ref.json"
          fi

          graphql_query='mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid }
              ref { name }
            }
          }'
          jq -n --arg query "$graphql_query" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg base_oid "$base_oid" \
            --arg headline "$commit_headline" \
            --arg body "$commit_body" \
            --slurpfile file_changes "$file_changes" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch},
              expectedHeadOid: $base_oid,
              message: {headline: $headline, body: $body},
              fileChanges: $file_changes[0]
            }}}' >"$create_commit_payload"
          if ! gh api graphql --input "$create_commit_payload" >"$create_commit_response"; then
            jq -r '.errors[]?.message // "GraphQL commit mutation failed"' \
              "$create_commit_response" >&2
            exit 1
          fi
          commit_sha="$(jq -er '.data.createCommitOnBranch.commit.oid // empty' "$create_commit_response")" || {
            jq -r '.errors[]?.message // "GraphQL commit mutation returned no commit"' \
              "$create_commit_response" >&2
            exit 1
          }
          [ "$(jq -r '.data.createCommitOnBranch.ref.name' "$create_commit_response")" = "$branch" ] || {
            echo "GraphQL commit mutation updated an unexpected branch" >&2
            exit 1
          }
          bash ./scripts/github-setup/verify-commit-verification.sh "$GITHUB_REPOSITORY" "$commit_sha"

          label_names="$(gh label list --limit 200 --json name --jq '.[].name')"
          required_labels=("dependencies" "automation: maintenance" "automation: validating" "automation: breaking" "automation: blocked")
          for label in "${required_labels[@]}"; do
            printf '%s\n' "$label_names" | grep -Fxq -- "$label" || {
              echo "required label is missing: $label" >&2
              exit 1
            }
          done

          edit_label_args=(--add-label dependencies --add-label "automation: maintenance" --add-label "automation: validating" --remove-label "automation: breaking" --remove-label "automation: blocked")
          breaking_count="$(jq '[.updates[] | select(.risk == "high" or .update_type == "major" or .update_type == "breaking")] | length' "$metadata_file")"
          unknown_count="$(jq '[.updates[] | select(.risk == "unknown" or .update_type == "unknown")] | length' "$metadata_file")"
          if [ "$breaking_count" -gt 0 ]; then
            edit_label_args+=(--add-label "automation: breaking")
          fi
          if [ "$unknown_count" -gt 0 ]; then
            edit_label_args+=(--add-label "automation: blocked")
          fi

          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            pr_number="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/pulls" \
              -f title="$title" \
              -f head="$branch" \
              -f base=main \
              -f body="$(< /tmp/weekly-tooling-pr-body.md)" \
              --jq '.number')"
          fi
          gh pr edit "$pr_number" --title "$title" --body-file /tmp/weekly-tooling-pr-body.md "${edit_label_args[@]}"

          if [ "$unknown_count" -gt 0 ]; then
            echo "Unknown update risk detected; leaving PR blocked without enabling auto-merge." >&2
            exit 0
          fi
          echo "Maintenance safety will authorize the separate Reviewer App to approve and enable squash auto-merge."
