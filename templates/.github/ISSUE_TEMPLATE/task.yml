name: Task
description: A single-PR unit of work tracked directly in this Issue.
title: "[TASK] "
labels:
  - type:task
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the concrete change in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and requirement
      description: State the exact change and requirement it satisfies.
    validations:
      required: true
  - type: input
    id: validation
    attributes:
      label: Validation command
      description: Give the exact command that proves this task is complete.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and test traceability
      description: State observable acceptance and named tests at the lowest suitable layer.
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: Use #123 when this Task belongs to a Story or Epic.
