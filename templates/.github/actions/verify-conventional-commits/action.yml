name: Verify Conventional Commits
description: Verify every pull-request commit follows the configured commitlint policy

inputs:
  token:
    description: GitHub token with pull-request read access
    required: true
  repository:
    description: Repository in owner/name format
    required: true
  pull-request-number:
    description: Pull request number to verify
    required: true
  config-path:
    description: Optional path to a repository commitlint configuration file
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up mise
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      with:
        install: true
    - name: Verify every pull-request commit follows commitlint policy
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        set -euo pipefail
        gh api --paginate --slurp \
          "/repos/$REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
          > commits.json
        jq -e 'flatten | length > 0' commits.json >/dev/null

        if [ -n "$CONFIG_PATH" ]; then
          mise x node@26.6.0 -- npm exec --yes \
            --package=@commitlint/cli@19.8.1 \
            --package=@commitlint/config-conventional@19.8.1 \
            -- bash -euo pipefail -c '
              while IFS= read -r -d "" message; do
                printf "%s\\n" "$message" | commitlint --config "$CONFIG_PATH"
              done < <(jq -jr "flatten[] | .commit.message, \\\"\\u0000\\\"" commits.json)
            '
        else
          mise x node@26.6.0 -- npm exec --yes \
            --package=@commitlint/cli@19.8.1 \
            --package=@commitlint/config-conventional@19.8.1 \
            -- bash -euo pipefail -c '
              package_root="$(cd "$(dirname "$(command -v commitlint)")/.." && pwd)"
              while IFS= read -r -d "" message; do
                printf "%s\\n" "$message" | commitlint --cwd "$package_root" --extends @commitlint/config-conventional
              done < <(jq -jr "flatten[] | .commit.message, \\\"\\u0000\\\"" commits.json)
            '
        fi

        echo "All pull-request commits follow the commitlint policy."
