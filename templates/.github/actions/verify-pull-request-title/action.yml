name: Verify Pull Request Title
description: Verify a pull-request title follows the configured commitlint policy

inputs:
  title:
    description: Pull request title to verify
    required: true
  config-path:
    description: Optional path to a repository commitlint configuration file
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up mise
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      with:
        install: true
    - name: Verify pull-request title follows commitlint policy
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        CONFIG_PATH: ${{ inputs.config-path }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "$ACTION_PATH/validate.sh"
