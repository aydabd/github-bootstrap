name: Verify Signed-off-by trailers
description: Verify every pull-request commit has a Signed-off-by trailer

inputs:
  token:
    description: GitHub token with pull-request read access
    required: true
  repository:
    description: Repository in owner/name format
    required: true
  pull-request-number:
    description: Pull request number to verify
    required: true

runs:
  using: composite
  steps:
    - name: Verify every pull-request commit has a Signed-off-by trailer
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import re
        import sys
        import urllib.error
        import urllib.request

        base_url = (
            f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
            f"/pulls/{os.environ['PR_NUMBER']}/commits"
        )
        commits = []
        page = 1
        while True:
            url = f"{base_url}?per_page=100&page={page}"
            request = urllib.request.Request(
                url,
                headers={
                    "Accept": "application/vnd.github+json",
                    "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                    "User-Agent": "github-bootstrap-signed-off-by",
                },
            )
            try:
                with urllib.request.urlopen(request, timeout=30) as response:
                    page_commits = json.load(response)
            except (OSError, urllib.error.URLError) as error:
                print(f"Unable to fetch pull-request commits: {error}", file=sys.stderr)
                raise SystemExit(1)
            if not page_commits:
                break
            commits.extend(page_commits)
            page += 1

        trailer = re.compile(r"^Signed-off-by:\s+[^<>\r\n]+ <[^<>\r\n]+>$", re.MULTILINE)
        missing = [item["sha"] for item in commits if not trailer.search(item["commit"]["message"])]
        if missing:
            print("Missing Signed-off-by: Name <email> trailer in commit(s):")
            print("\n".join(missing))
            raise SystemExit(1)
        print(f"Verified Signed-off-by trailer on all {len(commits)} pull-request commit(s).")
        PY
