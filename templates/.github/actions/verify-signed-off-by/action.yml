name: Verify Signed-off-by trailers
description: Verify every pull-request commit has a Signed-off-by trailer

inputs:
  token:
    description: GitHub token with pull-request read access
    required: true
  repository:
    description: Repository in owner/name format
    required: true
  pull-request-number:
    description: Pull request number to verify
    required: true

runs:
  using: composite
  steps:
    - name: Verify every pull-request commit has a Signed-off-by trailer
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
      run: |
        set -euo pipefail
        gh api --paginate --slurp \
          "/repos/$REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
          > commits.json
        jq -e '
          flatten
          | length > 0
          and all(.[];
            (.author.login == "github-actions[bot]")
            or (.commit.message | test("(?m)^Signed-off-by: .+ <[^>]+>\\n?$"))
          )
        ' commits.json >/dev/null
        echo "All pull-request commits are signed off or generated by github-actions[bot]."
