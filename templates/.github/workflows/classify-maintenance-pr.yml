name: Classify Maintenance Pull Request

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  classify:
    name: Classify trusted automation PR
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    environment: production-maintenance
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out validation helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/validate-maintenance-pr.sh

      - name: Create Maintenance Writer App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOOTSTRAP_MAINTENANCE_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOOTSTRAP_MAINTENANCE_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: read

      - name: Classify and label trusted automation PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FULL_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr_file="$RUNNER_TEMP/pull-request.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr_file"
          classification="$(bash .github/scripts/validate-maintenance-pr.sh "$pr_file")"

          gh pr edit "$PR_NUMBER" \
            --add-label "automation: maintenance" \
            --add-label "automation: validating"
          if [ "$classification" = "dependabot" ]; then
            gh pr edit "$PR_NUMBER" --add-label dependencies
          fi
