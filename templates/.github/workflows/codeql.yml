# CodeQL Security Analysis
#
# Scans code for security vulnerabilities and bugs using GitHub's CodeQL engine.
# Runs on every PR targeting main, every push to main, and weekly on Monday.
#
# The language matrix is configured automatically by the bootstrap workflow based
# on the languages selected at repository creation time. To add or remove a
# language, edit the matrix below.
#
# GitHub Actions workflow analysis is always enabled; application languages are
# added by the bootstrap renderer.
name: CodeQL Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly on Monday at 02:00 UTC to catch newly-disclosed CVEs.
    - cron: "0 2 * * 1"

# Cancel superseded runs on the same ref to save resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [{{CODEQL_LANGUAGES}}]

    steps:
      - name: Checkout repository
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          persist-credentials: false

      - name: Detect source files for language
        id: detect-source
        shell: bash
        run: |
          case "${{ matrix.language }}" in
            "actions")
              PATTERN='\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml)$'
              ;;
            "python")
              PATTERN='\.py$'
              ;;
            "javascript-typescript")
              PATTERN='\.(js|jsx|ts|tsx|mjs|cjs)$'
              ;;
            "java-kotlin")
              PATTERN='\.(java|kt|kts)$'
              ;;
            "csharp")
              PATTERN='\.cs$'
              ;;
            "go")
              PATTERN='\.go$'
              ;;
            "ruby")
              PATTERN='(^|/)Gemfile$|\.rb$'
              ;;
            "cpp")
              PATTERN='\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
              ;;
            *)
              PATTERN='.'
              ;;
          esac

          if git ls-files | grep -Eq "$PATTERN"; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
            echo "Found source files for ${{ matrix.language }}"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "No source files found for ${{ matrix.language }}; CodeQL will be skipped for this language"
          fi

      - name: Skip CodeQL when no source files are present
        if: steps.detect-source.outputs.has_source != 'true'
        run: |
          echo "Skipping CodeQL for ${{ matrix.language }} because no matching source files were found." >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize CodeQL
        if: steps.detect-source.outputs.has_source == 'true'
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        if: steps.detect-source.outputs.has_source == 'true' && matrix.language != 'actions'
        uses: github/codeql-action/autobuild@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4

      - name: Perform CodeQL Analysis
        if: steps.detect-source.outputs.has_source == 'true'
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          category: "/language:${{ matrix.language }}"
