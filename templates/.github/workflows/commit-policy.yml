name: Commit policy

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: commit-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-off-by:
    name: Signed-off-by trailers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out pull-request revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify Signed-off-by trailers
        uses: ./.github/actions/verify-signed-off-by
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}

  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out pull-request revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify conventional commits
        uses: ./.github/actions/verify-conventional-commits
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}

  pull-request-title:
    name: Pull-request title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out pull-request revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify pull-request title
        uses: ./.github/actions/verify-pull-request-title
        with:
          title: ${{ github.event.pull_request.title }}
