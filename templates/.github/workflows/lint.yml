name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      ENV_MANAGER: "{{ENV_MANAGER}}"

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up micromamba environment
        if: env.ENV_MANAGER == 'micromamba'
        uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3.1.0
        with:
          environment-file: environment.yml
          environment-name: "{{REPOSITORY_NAME}}"
          cache-environment: true
          cache-downloads: true

      - name: Set up mise
        if: env.ENV_MANAGER == 'mise'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true

      - name: Install mise task tools
        if: env.ENV_MANAGER == 'mise'
        shell: bash
        run: |
          mise tasks run install-tools
          sudo apt-get update
          sudo apt-get install -y libxml2-utils jq

      - name: Set up system tools
        if: env.ENV_MANAGER == 'system'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt libxml2-utils jq
          python3 -m pip install --user pre-commit==4.6.2 yamllint==1.38.0 editorconfig-checker==3.11.1
          npm install -g prettier@3.9.6 markdownlint-cli@0.49.1 @taplo/cli@0.7.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache pre-commit hook environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # LINT_MODE=check → all hooks run in check-only mode (no auto-fix).
      - name: Run lint (check mode)
        shell: bash
        run: LINT_MODE=check make lint
