name: Central maintenance safety
description: Validate an exact pull-request head before maintenance automation proceeds.
inputs:
  repository:
    description: Repository in OWNER/REPOSITORY form.
    required: true
  head_sha:
    description: Exact pull-request head SHA to validate.
    required: true
  pull_request_number:
    description: Pull-request number being validated.
    required: true
  token:
    description: Short-lived workflow token with the permissions declared by the caller.
    required: true
runs:
  using: composite
  steps:
    - name: Validate maintenance safety
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
      run: |
        set -euo pipefail

        fail() {
          echo "Central maintenance safety blocked: $*" >&2
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/labels" \
            -f 'labels[]=automation: blocked' >/dev/null || true
          exit 1
        }

        pr_json="$(gh api "/repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}")" ||
          fail "pull request could not be read"
        actual_head_sha="$(jq -r '.head.sha // empty' <<<"${pr_json}")"
        [[ "${actual_head_sha}" == "${EXPECTED_HEAD_SHA}" ]] ||
          fail "pull request head changed (expected ${EXPECTED_HEAD_SHA}, got ${actual_head_sha})"

        labels_json="$(gh api "/repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/labels?per_page=100")" ||
          fail "pull request labels could not be read"
        jq -e 'all(.[]; .name != "automation: blocked")' <<<"${labels_json}" >/dev/null ||
          fail "pull request is already blocked"

        runs_json="$(gh api "/repos/${REPOSITORY}/actions/runs?head_sha=${EXPECTED_HEAD_SHA}&event=pull_request&per_page=100")" ||
          fail "workflow runs could not be read"
        required_workflows=("Quality" "Commit policy" "Test Quality Providers" "CodeQL Security Scan")
        for workflow_name in "${required_workflows[@]}"; do
          run_status="$(jq -r --arg name "${workflow_name}" --arg sha "${EXPECTED_HEAD_SHA}" '
            [.workflow_runs[] | select(.name == $name and .head_sha == $sha)]
            | sort_by(.completed_at // "") | last | (.conclusion // "")
          ' <<<"${runs_json}")"
          [[ "${run_status}" == "success" ]] ||
            fail "required workflow is not successful for the exact head: ${workflow_name}"
        done

        gh api --method POST \
          -H 'Accept: application/vnd.github+json' \
          "/repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/labels" \
          -f 'labels[]=automation: accepted' >/dev/null ||
          fail "accepted lifecycle label could not be published"
        echo "Central maintenance safety accepted ${EXPECTED_HEAD_SHA}."
