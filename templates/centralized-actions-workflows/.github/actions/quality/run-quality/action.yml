name: Run selected quality capabilities
description: Run selected quality capabilities against the calling repository.

inputs:
  capabilities:
    description: Comma-separated capability identifiers.
    required: true
  environment-manager:
    description: Selected local tooling provider.
    required: false
    default: system

runs:
  using: composite
  steps:
    - name: Run selected capabilities
      shell: bash
      env:
        CAPABILITIES: ${{ inputs.capabilities }}
        ENVIRONMENT_MANAGER: ${{ inputs['environment-manager'] }}
        WORKING_DIRECTORY: ${{ github.workspace }}
      run: |
        set -euo pipefail
        [ -n "$CAPABILITIES" ] || { echo "At least one quality capability is required" >&2; exit 1; }

        provider_run() {
          if [ "$ENVIRONMENT_MANAGER" = system ]; then
            "$@"
          else
            bash "$WORKING_DIRECTORY/scripts/provider-run.sh" "$@"
          fi
        }

        IFS=',' read -r -a selected <<< "$CAPABILITIES"
        for capability in "${selected[@]}"; do
          capability="$(printf '%s' "$capability" | sed 's/^ *//;s/ *$//')"
          case "$capability" in
            lint-markdown) provider_run markdownlint --config "$GITHUB_ACTION_PATH/config/.markdownlint.json" --ignore-path "$GITHUB_ACTION_PATH/config/.markdownlintignore" "$WORKING_DIRECTORY" ;;
            lint-json) provider_run bash -c "cd \"$WORKING_DIRECTORY\" && find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -name '*.json' -exec jq empty {} +" ;;
            lint-yaml) provider_run bash "$GITHUB_ACTION_PATH/scripts/lint-yaml.sh" "$WORKING_DIRECTORY" "$GITHUB_ACTION_PATH/config/.yaml-lint.yml" "$GITHUB_ACTION_PATH/config/.yaml-lint-ignore" ;;
            lint-actions) (cd "$WORKING_DIRECTORY" && provider_run actionlint -ignore 'SC[0-9]+'); provider_run uv run zizmor --pedantic "$WORKING_DIRECTORY/.github" ;;
            lint-shell) provider_run bash "$GITHUB_ACTION_PATH/scripts/lint-shell.sh" "$WORKING_DIRECTORY" "$GITHUB_ACTION_PATH/config/.shell-lint-ignore" ;;
            lint-python) provider_run python3 -m compileall -q "$WORKING_DIRECTORY" ;;
            lint-terraform)
              terraform_file="$(find "$WORKING_DIRECTORY" -type f -name '*.tf' -print -quit)"
              if [ -z "$terraform_file" ]; then
                echo "No Terraform files found; skipping lint-terraform"
              else
                terraform_dir="$(dirname "$terraform_file")"
                provider_run terraform fmt -check -recursive
                provider_run terraform -chdir="$terraform_dir" init -backend=false -input=false
                provider_run terraform -chdir="$terraform_dir" validate
              fi
              ;;
            lint-format) (cd "$WORKING_DIRECTORY" && LINT_MODE=check provider_run uv run pre-commit run --all-files --color=always) ;;
            lint-tests)
              if [ -f "$WORKING_DIRECTORY/go.mod" ]; then (cd "$WORKING_DIRECTORY" && provider_run go test ./...); fi
              if [ -f "$WORKING_DIRECTORY/package.json" ]; then (cd "$WORKING_DIRECTORY" && provider_run npm test --if-present); fi
              if [ -f "$WORKING_DIRECTORY/pyproject.toml" ] || [ -f "$WORKING_DIRECTORY/pytest.ini" ]; then
                if (cd "$WORKING_DIRECTORY" && provider_run python3 -c "import pytest" >/dev/null 2>&1); then
                  (cd "$WORKING_DIRECTORY" && provider_run uv run python3 -m pytest)
                else
                  echo "pytest is not installed; skipping Python tests"
                fi
              fi
              ;;
            *) echo "Unknown quality capability: $capability" >&2; exit 1 ;;
          esac
        done
