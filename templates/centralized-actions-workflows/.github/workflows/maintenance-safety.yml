name: Centralized Maintenance Safety

on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository in OWNER/REPOSITORY form.
        required: true
        type: string
      head-sha:
        description: Exact pull-request head SHA to validate.
        required: true
        type: string
      pull-request-number:
        description: Pull-request number being validated.
        required: true
        type: number

permissions: {}

jobs:
  maintenance-safety:
    name: Maintenance safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Run central maintenance safety
        uses: ./.github/actions/maintenance-safety
        with:
          repository: ${{ inputs.repository }}
          head_sha: ${{ inputs['head-sha'] }}
          pull_request_number: ${{ inputs['pull-request-number'] }}
          token: ${{ github.token }}
