name: Centralized Maintenance Safety

on:
  workflow_call:
    inputs:
      repository:
        description: Consumer repository in OWNER/REPOSITORY form.
        required: true
        type: string
      head-sha:
        description: Exact pull-request head SHA to validate.
        required: true
        type: string
      pull-request-number:
        description: Pull-request number being validated.
        required: true
        type: number
      central-repository:
        description: Immutable central package repository in OWNER/REPOSITORY form.
        required: true
        type: string
      central-ref:
        description: Immutable central package ref.
        required: true
        type: string

permissions: {}

jobs:
  maintenance-safety:
    name: Maintenance safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out central workflow package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs['central-repository'] }}
          ref: ${{ inputs['central-ref'] }}
          path: .central-workflows
          persist-credentials: false
      - name: Run central maintenance safety
        uses: ./.central-workflows/.github/actions/maintenance-safety
        with:
          repository: ${{ inputs.repository }}
          head_sha: ${{ inputs['head-sha'] }}
          pull_request_number: ${{ inputs['pull-request-number'] }}
          token: ${{ github.token }}
