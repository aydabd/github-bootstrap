---
# =============================================================================
# {{REPOSITORY_NAME}} — Pre-commit hooks (source of truth for all linting)
# =============================================================================
# Linters run from the selected environment manager when available.
# Some hooks (for example, npx-invoked tools) may download dependencies if not preinstalled.
# Tool versions are managed by environment.yml / mise.toml.
#
# Everything uses `repo: local` with `language: system` so pre-commit
# calls environment-installed binaries directly.
#
# LINT_MODE:
#   fix   — auto-fix formatting (default for local development)
#   check — check-only, fail on violations (set by CI)
# =============================================================================
exclude: |-
  (?x)^(
    build/
    |\.gradle/
  )
repos:
  # ── Standard file hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── All local hooks use language: system ───────────────────────────────────
  - repo: local
    hooks:
      # ── EditorConfig compliance ────────────────────────────────────────────
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: ec
        language: system
        exclude: >
          (?x)^(
            .*\.(png|jpg|jpeg|gif|ico|svg|pdf|lock)|
            \.git/.*
          )$
      # ── Java: formatting (Spotless via Gradle) ────────────────────────────
      - id: spotless
        name: spotless (Java formatting)
        entry: bash
        args:
          - -c
          - |
            if [ "$LINT_MODE" = "check" ]; then
              ./gradlew spotlessCheck
            else
              ./gradlew spotlessApply
            fi
        language: system
        files: '\.java$'
        pass_filenames: false

      # ── Java: style checks (Checkstyle if configured) ─────────────────────
      - id: checkstyle
        name: checkstyle
        entry: bash
        args:
          - -c
          - |
            task_probe_output=$(./gradlew -q help --task checkstyleMain 2>&1) || {
              if echo "$task_probe_output" | grep -q "Task 'checkstyleMain' not found"; then
                echo "Checkstyle plugin not configured; skipping."
                exit 0
              fi
              echo "$task_probe_output"
              exit 1
            }
            ./gradlew checkstyleMain checkstyleTest
        language: system
        files: '\.java$'
        pass_filenames: false

      # ── Java: unit tests (pre-push) ───────────────────────────────────────
      - id: gradle-test
        name: gradle test
        entry: ./gradlew
        args: [test]
        language: system
        pass_filenames: false
        stages: [pre-push]

      # ── Shell: formatting (shfmt) ─────────────────────────────────────────
      - id: shfmt
        name: shfmt
        entry: bash
        args:
          - -c
          - |
            if [ "$LINT_MODE" = "check" ]; then
              shfmt -d -i 4 -ci -sr "$@"
            else
              shfmt -w -i 4 -ci -sr "$@"
            fi
          - shfmt
        language: system
        types: [shell]

      # ── Shell: linting (shellcheck) ───────────────────────────────────────
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      # ── XML: validation (xmllint) ─────────────────────────────────────────
      - id: xmllint
        name: xmllint
        entry: xmllint
        args: [--noout]
        language: system
        types: [xml]

      # ── TOML: formatting + validation (taplo) ─────────────────────────────
      - id: taplo
        name: taplo
        entry: bash
        args:
          - -c
          - |
            if [ "$LINT_MODE" = "check" ]; then
              taplo check "$@" && taplo fmt --check "$@"
            else
              taplo fmt "$@"
            fi
          - taplo
        language: system
        types: [toml]

      # ── YAML: linting (yamllint) ──────────────────────────────────────────
      - id: yamllint
        name: yamllint
        entry: yamllint
        args: [--config-file, .github/linters/.yaml-lint.yml]
        language: system
        types: [yaml]

      # ── Markdown: linting (markdownlint-cli) ──────────────────────────────
      - id: markdownlint
        name: markdownlint
        entry: bash
        args:
          - -c
          - |
            if [ "$LINT_MODE" = "check" ]; then
              markdownlint --config .github/linters/.markdownlint.json --ignore CHANGELOG.md "$@"
            else
              markdownlint --fix --config .github/linters/.markdownlint.json --ignore CHANGELOG.md "$@" || true
            fi
          - markdownlint
        language: system
        types: [markdown]

      # ── JSON / YAML / Markdown: formatting (prettier) ─────────────────────
      - id: prettier
        name: prettier
        entry: bash
        args:
          - -c
          - |
            if [ "$LINT_MODE" = "check" ]; then
              prettier --check --config .prettierrc.yaml --ignore-path .prettierignore "$@" || {
                echo "Files need formatting. Run: make quality"
                exit 1
              }
            else
              prettier -w --config .prettierrc.yaml --ignore-path .prettierignore "$@"
            fi
          - prettier
        language: system
        types_or: [json, yaml, markdown]

      - id: lint-actions
        name: actionlint and zizmor
        entry: ./scripts/lint-github-actions.sh
        language: system
        pass_filenames: false
        stages: [manual]
        files: '^\.github/(workflows|actions)/.*\.ya?ml$'

  # ── Commit message: conventional commits ──────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
