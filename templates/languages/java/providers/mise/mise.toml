[tools]
python = "{{PYTHON_VERSION}}"
node = "{{NODE_VERSION}}"
uv = "0.11.30"
shellcheck = "0.11.0"
actionlint = "1.7.12"
shfmt = "3.13.1"
java = "temurin-{{JAVA_VERSION}}"
terraform = "1.15.6"
taplo = "0.10.0"

[tasks.install-tools]
run = [
  "uv sync --locked",
  "npm ci --ignore-scripts --no-fund",
  "npm audit --audit-level=high",
]
